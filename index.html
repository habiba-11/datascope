<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataScope: The Evidence Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #E6F4FF;
      color: #17324D;
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
    }

    .card {
      background: white;
      border: 3px solid #17324D;
      border-radius: 20px;
      box-shadow: 8px 8px 0 #17324D;
      padding: 32px 40px;
      text-align: center;
      max-width: 420px;
    }

    h1 {
      font-family: 'Baloo 2', sans-serif;
      font-size: 32px;
      margin: 8px 0;
    }

    .mascot {
      font-size: 56px;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #17324D;
    }

    .ask { background: #FF7A6B; }
    .plan { background: #FFC531; }
    .collect { background: #38B6FF; }
    .explore { background: #4CC26B; }
    .conclude { background: #8E7CFF; }

    button {
      font-family: 'Baloo 2', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: white;
      background: #2E9A4F;
      border: 3px solid #17324D;
      border-radius: 14px;
      box-shadow: 4px 4px 0 #17324D;
      padding: 10px 24px;
      cursor: pointer;
    }

    button:active {
      box-shadow: 1px 1px 0 #17324D;
      transform: translate(3px, 3px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mascot">🦉</div>
    <h1>Hello, DataScope!</h1>
    <p>I'm Pip, your data-detective guide. Let's go find some evidence!</p>
    <div class="dots">
      <span class="dot ask"></span>
      <span class="dot plan"></span>
      <span class="dot collect"></span>
      <span class="dot explore"></span>
      <span class="dot conclude"></span>
    </div>
    <button type="button">Say hi to Pip</button>
  </div>
</body>
</html>
