<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataScope: The Evidence Lab</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/ambient.css">
  <link rel="stylesheet" href="css/scenes.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/story.css">
  <link rel="stylesheet" href="css/welcome.css">
  <link rel="stylesheet" href="css/wardrobe.css">
</head>
<body>
  <header class="welcome-top">
    <span class="logo" id="logo"></span>
  </header>
  <!-- Part 59g: the look of docs/design/datascope-welcome-ui.html. Big Pip stands on
       the left (Sara is only in the story), the words and the code on the right. -->
  <main class="welcome">
    <div class="mascot-col">
      <div class="mascot" id="mascot"></div>
      <div id="dress-slot"></div>
    </div>
    <section class="welcome-panel m-rise">
      <p class="welcome-pill">Hoo-hoo! I'm Pip, your guide.</p>
      <h1 class="welcome-title">Become a Data <span>Detective!</span></h1>
      <p class="welcome-lead">Ask a question. Collect answers. Find out what the data says.</p>
      <form id="code-form" class="code-form">
        <label for="code-input"><span data-icon="key"></span> Type your explorer code</label>
        <div class="code-box" id="code-box">
          <input id="code-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. OWL-07" aria-describedby="code-help">
          <span class="code-ok" aria-hidden="true">✓</span>
        </div>
        <p class="code-help" id="code-help" role="status">Your teacher gives you this code. Please don't type your name!</p>
        <button class="btn btn-main" type="submit">Start exploring →</button>
        <button class="btn btn-secondary" id="see-how" type="button"><span data-icon="play"></span> Watch the story again</button>
      </form>
      <a class="btn btn-quiet teacher-btn" href="teacher/index.html"><span data-icon="chart"></span> Teacher's view</a>
    </section>
  </main>
  <script type="module" src="js/welcome.js"></script>
  <div class="hills" aria-hidden="true">
    <svg viewBox="0 0 1280 220" preserveAspectRatio="none">
      <ellipse class="hill-back" cx="200" cy="250" rx="480" ry="150"></ellipse>
      <ellipse class="hill-front" cx="1040" cy="270" rx="560" ry="170"></ellipse>
    </svg>
  </div>
</body>
</html>
