<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataScope: The Evidence Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .welcome {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      text-align: center;
      max-width: 420px;
    }

    .mascot {
      font-size: 56px;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--color-navy);
    }

    .dot.ask { background: var(--color-ask); }
    .dot.plan { background: var(--color-plan); }
    .dot.collect { background: var(--color-collect); }
    .dot.explore { background: var(--color-explore); }
    .dot.conclude { background: var(--color-conclude); }

    .code-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .code-form label {
      font-family: var(--font-heading);
      font-weight: 700;
    }

    #code-input {
      width: 200px;
      min-height: 48px;
      font-family: var(--font-heading);
      font-size: 24px;
      text-align: center;
      text-transform: uppercase;
      border: var(--border-width) solid var(--color-navy);
      border-radius: 12px;
    }

    .code-help {
      font-size: 16px;
      margin: 0;
    }

    .code-help.warn {
      font-weight: 700;
    }

    /* "Teacher's view": a white button under the start form (opens with a PIN). */
    .teacher-btn {
      margin-top: 18px;
      background: white;
      color: var(--color-text);
    }
  </style>
</head>
<body>
  <main class="welcome">
    <div class="card">
      <div class="mascot">🦉</div>
      <h1>Hello, DataScope!</h1>
      <p>I'm Pip, your data-detective guide. Let's go find some evidence!</p>
      <div class="dots">
        <span class="dot ask"></span>
        <span class="dot plan"></span>
        <span class="dot collect"></span>
        <span class="dot explore"></span>
        <span class="dot conclude"></span>
      </div>
      <form id="code-form" class="code-form">
        <label for="code-input">🔑 Type your explorer code</label>
        <input id="code-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. OWL-07">
        <p class="code-help" id="code-help">Your teacher gives you this code. Please don't type your name!</p>
        <button class="btn btn-main" type="submit">Start exploring →</button>
      </form>
      <a class="btn teacher-btn" href="teacher/index.html">🧑‍🏫 Teacher's view</a>
    </div>
  </main>
  <script type="module" src="js/welcome.js"></script>
  <div class="hills" aria-hidden="true">
    <svg viewBox="0 0 1200 200" preserveAspectRatio="none">
      <path class="hill-back" d="M0,100 C150,60 300,140 450,100 C600,60 750,140 900,100 C1050,60 1150,120 1200,100 L1200,200 L0,200 Z"></path>
      <path class="hill-front" d="M0,150 C150,110 300,180 450,140 C600,100 750,170 900,140 C1050,110 1150,160 1200,140 L1200,200 L0,200 Z"></path>
    </svg>
  </div>
</body>
</html>
