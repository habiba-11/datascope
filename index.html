<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataScope: The Evidence Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/welcome.css">
</head>
<body>
  <header class="welcome-top">
    <span class="logo" id="logo"></span>
  </header>
  <main class="welcome">
    <div class="mascot m-float" id="mascot"></div>
    <div>
      <p class="welcome-pill m-pop">Hoo-hoo! I'm Pip, your guide.</p>
      <h1 class="welcome-title m-rise" style="--i: 1">Become a Data <span>Detective!</span></h1>
      <p class="welcome-lead m-rise" style="--i: 2">Ask a question. Collect answers. Find out what the data says.</p>
      <form id="code-form" class="code-form m-rise" style="--i: 3">
        <label for="code-input">🔑 Type your explorer code</label>
        <input id="code-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. OWL-07">
        <p class="code-help" id="code-help">Your teacher gives you this code. Please don't type your name!</p>
        <button class="btn btn-main" type="submit">Start exploring →</button>
      </form>
      <a class="btn btn-quiet teacher-btn" href="teacher/index.html">🧑‍🏫 Teacher's view</a>
    </div>
  </main>
  <script type="module" src="js/welcome.js"></script>
  <div class="hills" aria-hidden="true">
    <svg viewBox="0 0 1280 220" preserveAspectRatio="none">
      <ellipse class="hill-back" cx="200" cy="250" rx="480" ry="150"></ellipse>
      <ellipse class="hill-front" cx="1040" cy="270" rx="560" ry="170"></ellipse>
    </svg>
  </div>
</body>
</html>
