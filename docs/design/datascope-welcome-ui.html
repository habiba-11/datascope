@keyframes headtilt{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes jaw{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.15)}}

@keyframes wingwave{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}

@keyframes wingflap{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
@keyframes hopj{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px)}}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes grass{0%,100%{transform:skewX(-4deg)}50%{transform:skewX(4deg)}}
@keyframes cloud{from{transform:translateX(-260px)}to{transform:translateX(1240px)}}
@keyframes fly{from{transform:translateX(-120px)}to{transform:translateX(1100px)}}
@keyframes wavy{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.25)}}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.1)}}

@keyframes sec{to{transform:rotate(360deg)}}

.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.headtilt{transform-box:fill-box;transform-origin:50% 100%;animation:headtilt 4.4s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.4s infinite}
.mouth-open{display:none;transform-box:fill-box;transform-origin:50% 0%}

/* ===================== art builders (all our own SVG) ===================== */
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const NV = '#17324D';

function cloud(y, s, dur, delay) {
  return `<g class="cloud" style="animation-duration:${dur}s;animation-delay:${delay}s"><g transform="translate(0 ${y}) scale(${s})"><ellipse cx="0" cy="30" rx="84" ry="14" fill="#B9D2E8" opacity=".55" filter="url(#b3)"/><g fill="url(#cloudG)"><ellipse cx="0" cy="18" rx="72" ry="20"/><circle cx="-36" cy="10" r="24"/><circle cx="0" cy="-5" r="33"/><circle cx="38" cy="8" r="27"/><circle cx="64" cy="17" r="16"/></g></g></g>`;
}

}
function outdoorBG() {
  const r = rng(11); let s = '';

  s += cloud(70, 1.25, 150, -40) + cloud(150, .8, 210, -130) + cloud(40, .6, 260, -210) + cloud(190, 1, 190, -80);
  s += bird(88, .8, 46, -10, '#2A3D52') + bird(118, .6, 58, -34, '#3A526C') + bird(60, .5, 70, -52, '#4B6785');
  s += '<path d="M0 300 Q120 236 260 284 T520 266 T760 282 T960 258 V400 H0Z" fill="url(#hillFar)"/>';
  for (let i = 0; i < 44; i++) { const x = i * 22 + r() * 10, y = 296 + r() * 14 - Math.sin(i / 3) * 6, rr = 14 + r() * 12; s += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${rr.toFixed(0)}" fill="url(#leafFar)"/>`; }
  s += '<rect y="280" width="960" height="70" fill="#fff" opacity=".28" filter="url(#b10)"/>';
  // school building
  s += `<g transform="translate(590 0)"><ellipse cx="160" cy="352" rx="170" ry="12" fill="#17324D" opacity=".18" filter="url(#b6)"/><rect x="20" y="236" width="280" height="116" fill="url(#brick)"/><rect x="20" y="236" width="280" height="116" fill="url(#shade)" opacity=".6"/>
  <path d="M6 238 L160 176 L314 238Z" fill="url(#roof)"/><path d="M6 238 L160 176 L314 238Z" fill="url(#shade)" opacity=".5"/><rect x="6" y="236" width="308" height="8" fill="#F6ECD8"/>
  <circle cx="160" cy="214" r="16" fill="#fff" stroke="#9A6B3A" stroke-width="4"/><path d="M160 214 V204 M160 214 L167 218" stroke="${NV}" stroke-width="2.4" stroke-linecap="round"/>
  ${[0, 1, 2, 3, 4].map(i => [0, 1].map(j => (i === 2 && j === 1) ? '' : `<g transform="translate(${38 + i * 52} ${256 + j * 48})"><rect width="38" height="34" rx="3" fill="#F6ECD8"/><rect x="4" y="4" width="30" height="26" fill="url(#glass)"/><path d="M19 4 V30 M4 17 H34" stroke="#F6ECD8" stroke-width="3"/><path d="M6 6 L18 6 L8 20Z" fill="#fff" opacity=".45"/></g>`).join('')).join('')}
  <g transform="translate(138 306)"><rect width="44" height="46" rx="3" fill="#F6ECD8"/><rect x="5" y="5" width="34" height="41" fill="#3F6C9E"/><path d="M22 5 V46" stroke="#F6ECD8" stroke-width="3"/><circle cx="17" cy="28" r="2" fill="#FFC531"/><circle cx="27" cy="28" r="2" fill="#FFC531"/></g>
  <rect x="316" y="120" width="5" height="232" fill="#C9D3DC"/><circle cx="318.5" cy="118" r="5" fill="#FFC531"/><g style="transform-origin:321px 130px;animation:flagw 2.2s ease-in-out infinite"><path d="M321 124 Q345 114 368 124 V150 Q345 140 321 150Z" fill="#4CC26B"/><circle cx="344" cy="136" r="6" fill="#fff" opacity=".85"/></g></g>`;

  // fence

  for (let x = 0; x < 980; x += 26) s += `<path d="M${x} 400 V372 L${x + 8} 362 L${x + 16} 372 V400Z" fill="#F7E9CC" stroke="#D6BD8E" stroke-width="1.5"/><path d="M${x + 3} 398 V374" stroke="#fff" stroke-width="2" opacity=".7"/>`;
  s += '<path d="M0 398 Q240 380 480 398 T960 392 V600 H0Z" fill="url(#grassG)"/>';
  for (let i = 0; i < 9; i++) s += `<path d="M${-60 + i * 130} 600 L${60 + i * 130} 600 L${210 + i * 130 - 80} 400 L${150 + i * 130 - 80} 400Z" fill="#fff" opacity="${i % 2 ? .05 : .0}"/>`;
  s += '<path d="M340 600 Q430 500 520 410 L590 410 Q520 510 560 600Z" fill="#EBD3A0" opacity=".85"/><path d="M340 600 Q430 500 520 410" stroke="#CDB07A" stroke-width="2" fill="none" opacity=".6"/>';
  // big tree
  s += `<g style="transform-origin:96px 440px;animation:sway 6s ease-in-out infinite"><ellipse cx="96" cy="446" rx="86" ry="14" fill="#17324D" opacity=".22" filter="url(#b6)"/><path d="M70 446 Q80 360 74 290 Q92 280 112 290 Q108 360 124 446Z" fill="url(#trunk)"/><path d="M86 300 Q70 270 56 252 M100 300 Q120 270 138 250" stroke="#6B4423" stroke-width="10" fill="none" stroke-linecap="round"/>
  ${[[96, 150, 62], [44, 190, 48], [150, 190, 50], [70, 230, 46], [128, 232, 46], [96, 210, 54], [34, 120, 34], [160, 120, 36], [96, 100, 40]].map(c => `<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="url(#leaf)"/>`).join('')}
  ${[...Array(34)].map(() => { const a = r() * 6.28, d = r() * 90; return `<circle cx="${(96 + Math.cos(a) * d * 1.05).toFixed(0)}" cy="${(160 + Math.sin(a) * d * .8).toFixed(0)}" r="${(3 + r() * 5).toFixed(1)}" fill="#A9F0A8" opacity=".5"/>`; }).join('')}</g>`;
  for (let i = 0; i < 110; i++) { const x = r() * 960, y = 404 + r() * 90, h = 10 + r() * 16, c = ['#3F9E57', '#58B86B', '#2F8A4A', '#6BCB7A'][i % 4]; s += `<path d="M${x.toFixed(0)} ${y.toFixed(0)} q2 -${(h * .6).toFixed(0)} ${(r() * 8 - 2).toFixed(0)} -${h.toFixed(0)}" stroke="${c}" stroke-width="2.4" fill="none" stroke-linecap="round" style="transform-origin:${x.toFixed(0)}px ${y.toFixed(0)}px;animation:grass ${(2 + r() * 2).toFixed(1)}s ease-in-out infinite;animation-delay:-${(r() * 3).toFixed(1)}s"/>`; }
  const fc = ['#FF7A6B', '#FFC531', '#fff', '#A596FF', '#FF9ACB'];
  for (let i = 0; i < 26; i++) { const x = 20 + r() * 920, y = 410 + r() * 70; if (x > 330 && x < 600 && y > 410 && y < 470) continue; const c = fc[i % 5]; s += `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})"><path d="M0 0 V14" stroke="#2F8A4A" stroke-width="2.2"/><g fill="${c}">${[0, 72, 144, 216, 288].map(a => `<ellipse cx="0" cy="-5" rx="3" ry="4.6" transform="rotate(${a})"/>`).join('')}</g><circle r="2.4" fill="#FFB400"/></g>`; }
  s += `<g style="animation:fly 36s linear infinite;animation-delay:-14s"><g transform="translate(0 340)"><g style="animation:wavy 2.6s ease-in-out infinite"><g style="transform-box:fill-box;transform-origin:50% 50%;animation:flap .3s ease-in-out infinite"><path d="M0 0 C-12 -14 -20 -2 -10 4 C-17 10 -8 18 0 6Z M0 0 C12 -14 20 -2 10 4 C17 10 8 18 0 6Z" fill="#FFC531" stroke="#17324D" stroke-width="1.6" stroke-linejoin="round"/></g></g></g></g>`;
  return s;
}

function indoorBG() {
  const r = rng(5); let s = '';
  s += '<rect width="960" height="600" fill="url(#wall)"/>';
  s += '<rect y="262" width="960" height="112" fill="url(#wains)"/><rect y="258" width="960" height="7" fill="#fff" opacity=".85"/><rect y="264" width="960" height="3" fill="#17324D" opacity=".08"/>';
  s += '<rect y="372" width="960" height="228" fill="url(#floor)"/>';
  for (let x0 = -400; x0 <= 1360; x0 += 96) s += `<path d="M${x0} 600 L${(480 + (x0 - 480) * .3).toFixed(0)} 372" stroke="#8C5B2D" stroke-width="2" opacity=".28"/>`;
  [396, 428, 470, 526, 590].forEach((y, i) => s += `<path d="M0 ${y} H960" stroke="#8C5B2D" stroke-width="${1.5 + i * .3}" opacity=".16"/>`);
  s += '<rect y="366" width="960" height="9" fill="#FFF7E6"/><rect y="372" width="960" height="4" fill="#17324D" opacity=".12"/>';
  // window
  s += `<g><rect x="38" y="62" width="266" height="196" fill="url(#winSky)"/><circle cx="220" cy="120" r="70" fill="url(#sunGlow)"/><circle cx="220" cy="120" r="16" fill="#FFF4B8"/>
  <path d="M38 210 Q100 170 170 200 T304 190 V258 H38Z" fill="#B9E3C8"/><path d="M38 232 Q120 206 200 226 T304 222 V258 H38Z" fill="#8FD0A5"/>
  ${[...Array(9)].map((_, i) => `<circle cx="${50 + i * 30}" cy="${214 + (i % 3) * 5}" r="${12 + (i % 3) * 3}" fill="#6DBB88"/>`).join('')}
  <g style="animation:cloud 90s linear infinite;animation-delay:-30s"><g transform="translate(60 100) scale(.5)" fill="#fff" opacity=".9"><ellipse cx="0" cy="18" rx="70" ry="18"/><circle cx="-30" cy="8" r="22"/><circle cx="6" cy="-4" r="28"/></g></g>
  <path d="M38 62 V258 M304 62 V258 M171 62 V258 M38 160 H304" stroke="#FFFFFF" stroke-width="9"/><rect x="34" y="58" width="274" height="204" fill="none" stroke="#FFFFFF" stroke-width="10"/><rect x="34" y="58" width="274" height="204" fill="none" stroke="#17324D" stroke-width="2" opacity=".15"/>
  <path d="M42 66 L120 66 L60 160Z" fill="#fff" opacity=".22"/>
  <rect x="22" y="262" width="298" height="14" rx="3" fill="url(#woodT)"/><rect x="22" y="274" width="298" height="4" fill="#17324D" opacity=".15"/>
  <path d="M30 56 H66 Q74 150 60 262 H30Z" fill="url(#curtain)"/><path d="M276 56 H312 V262 H282 Q268 150 276 56Z" fill="url(#curtain)"/><path d="M66 150 Q80 160 66 172" stroke="#FFC531" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M276 150 Q262 160 276 172" stroke="#FFC531" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M30 52 H312" stroke="#8C5B2D" stroke-width="7" stroke-linecap="round"/>
  <g transform="translate(236 226)"><path d="M0 8 L36 8 L31 36 L5 36Z" fill="#E2735A" transform="translate(0 0)"/><path d="M5 8 Q-14 -16 4 -26 Q10 -4 18 4Z M18 6 Q10 -30 30 -32 Q30 -6 22 6Z M22 6 Q36 -22 54 -14 Q44 0 24 8Z" fill="#4CC26B" stroke="#2F8A4A" stroke-width="1.4"/></g></g>`;
  // light beam + dust
  s += '<path d="M60 262 L300 262 L690 520 L330 520Z" fill="url(#beam)" opacity=".55" style="animation:pulse 6s ease-in-out infinite"/>';
  for (let i = 0; i < 18; i++) { const x = 160 + r() * 360, y = 300 + r() * 200; s += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(1.2 + r() * 1.8).toFixed(1)}" fill="#FFF8D8" style="--dx:${(r() * 30 - 10).toFixed(0)}px;--dy:${(-20 - r() * 40).toFixed(0)}px;animation:mote ${(6 + r() * 6).toFixed(1)}s ease-in-out infinite;animation-delay:-${(r() * 8).toFixed(1)}s"/>`; }
  // whiteboard
  s += `<g><rect x="396" y="62" width="500" height="206" rx="9" fill="#C4CFDA" stroke="#8A9BAD" stroke-width="2"/><rect x="404" y="70" width="484" height="190" rx="4" fill="url(#board)"/><path d="M420 70 L470 70 L404 190 L404 150Z" fill="#fff" opacity=".6"/><path d="M700 70 L730 70 L630 260 L600 260Z" fill="#fff" opacity=".35"/>

  // clock

}

/* ---------------- characters ---------------- */
function sara(mood) {
  const sk = '#D49A66', skd = '#B07845', hs = '#E9604F', hsd = '#B83F32';
  const arm = (d) => `<path d="${d}" stroke="${hsd}" stroke-width="19" fill="none" stroke-linecap="round"/><path d="${d}" stroke="${hs}" stroke-width="15" fill="none" stroke-linecap="round"/>`;
  const hand = (x, y) => `<circle cx="${x}" cy="${y}" r="9" fill="${sk}" stroke="${skd}" stroke-width="1.6"/>`;
  let before = '', after = '';
  if (mood === 'cheer') after = arm('M66 126 Q24 100 34 46') + arm('M134 126 Q176 100 166 46') + hand(34, 38) + hand(166, 38);
  else {
    const left = mood === 'clip' ? arm('M66 128 Q42 160 64 176') + hand(68, 178) : mood === 'write' ? arm('M66 128 Q56 172 88 180') + hand(94, 178) : arm('M66 128 Q50 170 58 206') + hand(58, 213);
    let right = arm('M134 128 Q150 170 142 206') + hand(142, 213);
    if (mood === 'think') right = arm('M134 128 Q172 150 130 116') + hand(124, 110);
    if (mood === 'point') right = `<g style="transform-box:fill-box;transform-origin:0% 100%;animation:wingidle 2.4s ease-in-out infinite">${arm('M134 126 Q176 122 212 100')}${hand(218, 97)}<path d="M218 97 L276 62" stroke="#8C5B2D" stroke-width="5" stroke-linecap="round"/><path d="M268 67 L278 61" stroke="#FFF" stroke-width="5" stroke-linecap="round"/></g>`;
    if (mood === 'write') right = arm('M134 128 Q152 174 114 184') + hand(108, 182);
    if (mood === 'write') before = '<g transform="rotate(-8 100 180)"><rect x="70" y="158" width="62" height="46" rx="4" fill="#fff" stroke="#9AA9B8" stroke-width="2"/><path d="M76 170 H124 M76 180 H118 M76 190 H110" stroke="#9CC6E6" stroke-width="2.4" stroke-linecap="round"/><path d="M100 70" /></g>';
    if (mood === 'write') after = '<path d="M110 180 L130 158" stroke="#17324D" stroke-width="6" stroke-linecap="round"/><path d="M110 180 L130 158" stroke="#FFC531" stroke-width="3" stroke-linecap="round"/>';
    if (mood === 'clip') before = '<g transform="translate(14 118) rotate(-10)"><rect width="58" height="78" rx="6" fill="#C99443" stroke="#8C5B2D" stroke-width="2"/><rect x="5" y="9" width="48" height="64" rx="2" fill="#fff"/><rect x="18" y="-4" width="22" height="12" rx="4" fill="#9AA9B8" stroke="#6E8196" stroke-width="1.6"/><path d="M11 26 l5 5 l9 -11" stroke="#217A3B" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 24 H46 M11 44 H46 M11 56 H38" stroke="#9CC6E6" stroke-width="3" stroke-linecap="round"/></g>';
    after = (mood === 'clip' ? '' : '') + after;
    before = left + before; after = right + after;
    var armsBefore = before, armsAfter = after;
