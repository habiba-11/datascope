<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataScope illustration sheet (3D, animated)</title>
<!-- Habiba's approved contact sheet (Part 52). Since Part 52b (10 Nov 2026) it draws
     the icons from js/illustrations.js itself, so the sheet always shows exactly
     what the app shows. Open it with Live Server (modules do not work from file://). -->
<style>
body{margin:0;padding:28px;background:#fff;font-family:Nunito,system-ui,sans-serif;color:#17324D}
h1{font-family:"Baloo 2",system-ui,sans-serif;margin:0 0 4px} p{margin:0 0 14px;color:#4A6580;font-weight:700}
h2{font-family:"Baloo 2",system-ui,sans-serif;margin:28px 0 10px}
button{font:inherit;font-weight:800;border:3px solid #17324D;background:#fff;border-radius:14px;padding:8px 16px;box-shadow:0 4px 0 #17324D;cursor:pointer;margin-bottom:18px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.c{border:3px solid #17324D;border-radius:18px;padding:12px;background:#fff}
.new{border-color:#4CC26B;box-shadow:0 0 0 4px #DDF6E3}
.r{display:flex;align-items:flex-end;gap:10px;background:#E6F4FF;border-radius:12px;padding:12px;margin-bottom:8px}
.r span:nth-child(2){background:#fff;border-radius:10px;padding:4px}
.r span:nth-child(3){background:#FFF0C2;border-radius:10px;padding:4px}
b{display:block;font-family:"Baloo 2",system-ui,sans-serif;font-size:18px} i{font-style:normal;font-size:14px;font-weight:700;color:#4A6580}
</style></head><body>
<h1>DataScope illustrations (3D, animated and playful)</h1>
<p>Our own inline SVG, every one moves on its own. Hover or tap an icon to make it jump. Each row: 32 px, 64 px, 96 px. Source: js/illustrations.js, use illustration('name', {size, label}).</p>
<button id="tog" type="button">Pause all animation</button>
<div id="sheet"></div>
<script type="module">
import { ILLUSTRATIONS, illustration, installIllustrationStyles } from '../../js/illustrations.js';
import { FLAT_STANDINS } from '../../js/illustrations-flat.js';

// What each icon means (the first 26: Habiba's notes from the approved sheet).
const SET_1 = {
  die: 'Dice, chance, Chance Lab', trophy: 'Trophy, winning a phase', star: 'Star, reward', medal: 'Badge, medal',
  magnifier: 'Investigate, look closely', clipboard: 'Data collection, checklist', chart: 'Graph, Graph Lab',
  bulb: 'Hint, idea', lock: 'Locked badge or room', heart: 'Like, kindness', thumbsup: 'Good job',
  party: 'Celebration, finale', coin: 'Coin flip, points', spinner: 'Spinner, chance device', bag: 'Bag of marbles',
  check: 'Correct', cross: 'Not quite, try again', question: 'Question, Ask step', pencil: 'Write, Plan step',
  target: 'Goal, guess close to target', clock: 'Time (use only where a clock is really needed)',
  book: 'Maths recap, learn', moon: 'Sleep (the story question)', flag: 'Finish, goal reached',
  flame: 'Streak, hot', sparkle: 'Shine, new',
};
// Part 52c: batch 2 of the 44 (new 3D drawings, waiting for Habiba's OK).
const BATCH_2 = {
  brain: 'What I learned (thinks, twinkles)', owl: 'Pip, our mascot (wobbles, blinks)',
  'lock-open': 'Unlocked (shackle pops up)', door: 'Leave the room (door opens a little)',
  music: 'Music switch (notes bob)', speaker: 'Sound on (waves pulse)', 'speaker-off': 'Sound off (cross shakes)',
  letters: 'Words, categories (blocks hop)', shoe: 'Shoe sizes (stomps)', ball: 'Games, playground (bounces)',
  pizza: 'Playground game scenario (wobbles)', shop: 'Shoe shop scenario (awning flutters)',
  tent: 'Sleep scenario (flag waves)', tools: 'Fix it (hammer taps)', 'book-green': 'Learn, recap (bobs)',
};
// Part 52b: batch 1 of the 44 (approved by Habiba, 10 Nov 2026).
const BATCH_1 = {
  tap: 'Tap here (finger presses, rings flash)', numbers: 'Numbers, Number Lab (blocks hop)',
  'crystal-ball': 'Predict (swirl turns, soft glow)', scales: 'Compare, fair or not (beam tilts)',
  masks: 'Pretend class (masks sway)', map: 'Plan step, My journey (route walks, X pulses)',
  warning: 'Careful (wobbles)', speech: 'Say it, Pip talks (dots type)', key: 'Explorer code (key turns)',
  ruler: 'Measure, range (seesaws)', repeat: 'Again, new investigation (turns once)',
  play: 'Watch the story (breathes)', cloud: 'Saved online (drifts)', 'cloud-off': 'Offline (drifts)',
  'id-card': 'My ID (wobbles)',
};

const card = (name, note, isNew) => `<div class="c${isNew ? ' new' : ''}"><div class="r">`
  + [32, 64, 96].map((size, i) => `<span>${illustration(name, { size, seed: 'abc'[i] })}</span>`).join('')
  + `</div><b>${name}</b><i>${note}</i></div>`;
const section = (title, names, notes, isNew) => `<h2>${title} (${names.length})</h2><div class="g">`
  + names.map((n) => card(n, notes[n] || '', isNew)).join('') + '</div>';

installIllustrationStyles();
const flat = Object.keys(FLAT_STANDINS).filter((n) => !SET_1[n] && !BATCH_1[n] && !BATCH_2[n]);
document.getElementById('sheet').innerHTML =
  section('Batch 2: new in 3D, please check', Object.keys(BATCH_2), BATCH_2, true)
  + section('Habiba\'s set', Object.keys(SET_1), SET_1, false)
  + section('Batch 1 (approved)', Object.keys(BATCH_1), BATCH_1, false)
  + section('Not redrawn yet (old flat drawing, still used by the app)', flat, {}, false);

let paused = false;
document.getElementById('tog').onclick = function () {
  paused = !paused;
  document.querySelectorAll('.ds-illo').forEach((e) => e.classList.toggle('still', paused));
  this.textContent = paused ? 'Play animation' : 'Pause all animation';
};
console.log('icons in the app:', Object.keys(ILLUSTRATIONS).length);
</script>
</body></html>
