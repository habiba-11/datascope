<!doctype html>

<title>DataScope: Pip's Wardrobe (UI reference)</title>
<!--
  Pip's Wardrobe: the UI reference for Part 53. Open in a browser. One file, no build step.

  What it shows (960x600 stage, scales to any window):
   - Big Pip in the middle, dressed live. Pip bobs, blinks and reacts with a jump, sparkles and a short line.
   - 5 category tabs: Hats, Face, Neck, Back, Hold. One item per slot. Tap to wear, tap again to take off.
   - 16 items. States on the cards: wearing (green tick), New! (coral ribbon), locked (dark silhouette + lock).
   - Tapping a locked item makes Pip say how to unlock it (Grade 5 words, same idea as the locked badges).
   - "Take everything off", "Surprise me", and a demo link that unlocks everything so you can review the art.
  Pretend child progress in this demo: badges Question Fixer, Brave Guesser, Data Collector, Graph Explorer;
  phases Ask, Plan, Collect, Explore done. Not earned yet: Mind Changer, Middle Finder, Because Builder,
  Evidence Expert, Chance Tester, Conclude.
  Rules shown on screen: dressing Pip is just for fun and never changes the investigation.
  Where the data lives: ITEMS in the script (in the app this becomes data/content/wardrobe.json + js/art/pip-outfits.js).
  Slots, back to front: back, body, neck, face, head, held. Items never cover Pip's beak.
  Look: Explorer's Toolkit. Navy #17324D, sky #E6F4FF, hills #BFE8C9, step colours ask #FF7A6B, plan #FFC531,
  collect #38B6FF, explore #4CC26B, conclude #A596FF, green button #217A3B. Fonts: Baloo 2 + Nunito.
  prefers-reduced-motion switches every animation off.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@700;800&display=swap">
<style>
html,body{margin:0;height:100%;background:#E6F4FF;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:#17324D}
#fit{position:absolute;left:50%;top:50%;width:960px;height:600px;transform-origin:center center}
#app{position:relative;width:960px;height:600px;overflow:hidden;background:#D3EEFF}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #FFC531;outline-offset:2px}
.hdr{position:absolute;left:0;top:0;right:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;box-sizing:border-box;z-index:5}

.stage{position:absolute;left:0;top:0;width:520px;height:600px}
.panel{position:absolute;left:520px;top:72px;width:420px;height:512px;background:#fff;border:4px solid #17324D;border-radius:26px;box-shadow:0 6px 0 #17324D;box-sizing:border-box;padding:14px 16px;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px}
.tab{flex:1;border:3px solid #17324D;background:#E6F4FF;border-radius:14px;height:46px;font-weight:800;font-size:15px;position:relative;display:flex;align-items:center;justify-content:center;gap:4px}
.tab[aria-selected=true]{background:#FFC531;box-shadow:0 3px 0 #17324D;transform:translateY(-1px)}
.tab .dot{position:absolute;top:-7px;right:-4px;background:#FF7A6B;color:#fff;border:2px solid #17324D;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;line-height:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;align-content:start;flex:1}
.card{position:relative;border:3px solid #17324D;background:#F4FAFF;border-radius:18px;height:128px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
.card .pv{width:100%;height:72px;display:flex;align-items:center;justify-content:center}
.card .pv svg{width:100%;height:100%;overflow:visible}
.card .nm{font-weight:800;font-size:14px;line-height:1.1;text-align:center;min-height:30px;display:flex;align-items:center}
.card[aria-pressed=true]{background:#E4F8E8;border-color:#217A3B;box-shadow:0 0 0 3px #4CC26B}
.tick{position:absolute;top:-9px;right:-9px;width:28px;height:28px;border-radius:50%;background:#217A3B;border:3px solid #17324D;display:flex;align-items:center;justify-content:center}
.new{position:absolute;top:-9px;left:-6px;background:#FF7A6B;color:#fff;font-weight:800;font-size:12px;border:3px solid #17324D;border-radius:10px;padding:1px 7px;transform:rotate(-6deg);animation:newpulse 1.6s ease-in-out infinite}
.card.locked{background:#EEF3F7;border-style:dashed;border-color:#7E91A5}
.card.locked .pv svg{filter:brightness(0) opacity(.28)}
.card.locked .nm{color:#4A6580}
.lock{position:absolute;top:30px;left:50%;margin-left:-15px;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #7E91A5;display:flex;align-items:center;justify-content:center}
.card.shake{animation:shake .45s}
.note{margin-top:8px;font-size:13px;font-weight:700;color:#4A6580;text-align:center}
.acts{position:absolute;left:92px;top:520px;display:flex;gap:12px;z-index:4}
.btn{border:3px solid #17324D;background:#fff;border-radius:16px;height:46px;padding:0 16px;font-weight:800;box-shadow:0 4px 0 #17324D;display:flex;align-items:center;gap:8px}
.btn.go{background:#217A3B;color:#fff}
.demo{position:absolute;left:22px;top:574px;font-size:12px;font-weight:800;background:none;border:none;color:#4A6580;text-decoration:underline;padding:0;z-index:4}
.bub{position:absolute;left:112px;top:76px;width:330px;min-height:70px;background:#fff;border:4px solid #17324D;border-radius:22px;padding:12px 16px;box-sizing:border-box;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:22px;line-height:1.15;z-index:3;animation:pop .35s ease-out both}
.bub:after{content:"";position:absolute;left:150px;bottom:-22px;width:0;height:0;border:12px solid transparent;border-top:20px solid #17324D}
.bub:before{content:"";position:absolute;left:154px;bottom:-14px;width:0;height:0;border:8px solid transparent;border-top:15px solid #fff;z-index:1}
.pipwrap{position:absolute;left:124px;top:222px;width:240px;height:264px;z-index:2}
.pipwrap svg{overflow:visible;width:100%;height:100%;display:block}
.hop{animation:hop .7s cubic-bezier(.3,.7,.4,1)}
.platform{position:absolute;left:104px;top:470px;width:280px;height:44px}
.spk{position:absolute;width:26px;height:26px;pointer-events:none;z-index:4;animation:spark .8s ease-out both}
.pbob{animation:pipbob 2.6s ease-in-out infinite}
.beak{transform-box:fill-box;transform-origin:50% 0%}
.talk .beak{animation:piptalk .26s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:pipblink 4.5s infinite}
.wingR{transform-box:fill-box;transform-origin:50% 15%;animation:wingidle 3s ease-in-out infinite}
.wfl{animation:flutter 1.4s ease-in-out infinite;transform-origin:26px 70px}
.cloud{position:absolute;animation:drift 60s linear infinite}
.sun{position:absolute;left:14px;top:76px}
@keyframes pipbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pipblink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes piptalk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.7)}}
@keyframes wingidle{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
@keyframes flutter{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}25%{transform:translateY(8px) scale(1.06,.92)}55%{transform:translateY(-30px) scale(.96,1.06)}80%{transform:translateY(0) scale(1.04,.96)}100%{transform:translateY(0) scale(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.85) translateY(8px)}100%{opacity:1;transform:none}}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}30%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1) rotate(90deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes newpulse{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(-6deg) scale(1.1)}}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(1100px)}}
@keyframes sunglow{0%,100%{opacity:.35;transform:scale(.95)}50%{opacity:.7;transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>

<script>

const S = 'stroke="#17324D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const S2 = 'stroke="#17324D" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"';
const star = (cx, cy, r, fill) => { let p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; p.push((cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1)); } return `<path d="M${p.join(' L')}Z" fill="${fill}" stroke="#17324D" stroke-width="1.4" stroke-linejoin="round"/>`; };
const hw = (y) => 16 * (y + 16) / 49;
const band = (y1, y2, c) => `<path d="M${60 - hw(y1)} ${y1} L${60 + hw(y1)} ${y1} L${60 + hw(y2)} ${y2} L${60 - hw(y2)} ${y2}Z" fill="${c}"/>`;

{ id: 'professor', slot: 'face', name: 'Professor glasses', vb: '10 38 100 42', say: 'Hmm, fascinating!', unlock: { type: 'badge', ref: 'Because Builder', super: true }, hint: 'Explain 3 answers using "because".',

{ id: 'wings', slot: 'back', name: 'Rainbow wings', vb: '-30 -14 180 150', say: 'Flutter flutter!', unlock: { type: 'phase', ref: 'Explore' }, hint: 'Finish the Explore step to find these wings.',
  art: { back: (() => { const w = `<g class="wfl"><path d="M26 66 Q-22 34 -6 -8 Q24 12 32 52Z" fill="#BFEAFF" fill-opacity=".92" ${S}/><path d="M26 80 Q-16 88 -8 128 Q24 108 32 92Z" fill="#E3DDFF" fill-opacity=".92" ${S}/><path d="M24 62 Q4 36 2 6 M26 84 Q6 96 0 118" stroke="#fff" stroke-opacity=".9" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="2" cy="40" r="3.4" fill="#FF7A6B"/><circle cx="6" cy="102" r="3" fill="#FFC531"/></g>`; return w + `<g transform="translate(120 0) scale(-1 1)">${w}</g>`; })() } },

{ id: 'magnifier', slot: 'held', name: 'Magnifier', vb: '86 52 52 58', say: 'I spy… a pattern!', unlock: { type: 'starter' },
  art: { held: `<g transform="translate(104 94)"><path d="M3 -2 L-8 12" stroke="#17324D" stroke-width="8" stroke-linecap="round"/><path d="M3 -2 L-8 12" stroke="#9A5F26" stroke-width="4" stroke-linecap="round"/><circle cx="12" cy="-15" r="11" fill="#D3EEFF" ${S}/><circle cx="12" cy="-15" r="11" fill="none" stroke="#E0A21B" stroke-width="1.6" transform="scale(.8) translate(3 -3.75)"/><path d="M6 -19 Q8 -23 12 -24" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></g>` } },
{ id: 'compass', slot: 'held', name: 'Compass', vb: '86 52 52 58', say: 'My guess points north!', unlock: { type: 'badge', ref: 'Brave Guesser' }, hint: 'Make a guess before you see the data.',
  art: { held: `<g transform="translate(104 94)"><circle cx="11" cy="-14" r="12" fill="#FFC531" ${S}/><circle cx="11" cy="-14" r="8.6" fill="#fff" stroke="#17324D" stroke-width="1.8"/><path d="M11 -22 L14.6 -14 L7.4 -14Z" fill="#FF7A6B" ${S2}/><path d="M11 -6 L14.6 -14 L7.4 -14Z" fill="#9CC6E6" ${S2}/><circle cx="11" cy="-14" r="1.4" fill="#17324D"/><circle cx="11" cy="-28" r="2.6" fill="#E0A21B" ${S2}/></g>` } },
{ id: 'clipboard', slot: 'held', name: 'Clipboard', vb: '86 52 52 58', say: 'Let me write that down.', unlock: { type: 'badge', ref: 'Data Collector' }, hint: 'Ask the whole pretend class.',
  art: { held: `<g transform="translate(104 94)"><rect x="1" y="-32" width="22" height="30" rx="3.5" fill="#C99443" ${S}/><rect x="4.5" y="-27" width="15" height="22" fill="#fff" stroke="#17324D" stroke-width="1.8"/><rect x="7.5" y="-35" width="9" height="6" rx="2" fill="#9AA9B8" ${S2}/><path d="M7 -20 l3 3 l5 -6" stroke="#217A3B" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 -11 H17" stroke="#9CC6E6" stroke-width="2" stroke-linecap="round"/></g>` } },
{ id: 'dice', slot: 'held', name: 'Lucky dice', vb: '86 52 52 58', say: 'Feeling lucky? Let us test it!', unlock: { type: 'badge', ref: 'Chance Tester' }, hint: 'Run 10 tries, then 500 tries.',
  art: { held: `<g transform="translate(104 94) rotate(12 13 -15)"><rect x="2" y="-27" width="22" height="22" rx="5.5" fill="#FF7A6B" ${S}/><g fill="#fff"><circle cx="8" cy="-21" r="2.2"/><circle cx="18" cy="-21" r="2.2"/><circle cx="13" cy="-16" r="2.2"/><circle cx="8" cy="-11" r="2.2"/><circle cx="18" cy="-11" r="2.2"/></g></g>` } }
];
const SLOTS = [['head', 'Hats'], ['face', 'Face'], ['neck', 'Neck'], ['back', 'Back'], ['held', 'Hold']];
const LOCKSVG = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="#7E91A5"/><path d="M8 11 V8 a4 4 0 0 1 8 0 V11" fill="none" stroke="#7E91A5" stroke-width="3" stroke-linecap="round"/></svg>';
const TICKSVG = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const state = { tab: 'head', worn: { head: 'explorer' }, showAll: false, seen: {}, line: 'Hi! Pick something to dress me up. It is just for fun!' };
const byId = (id) => ITEMS.find(i => i.id === id);
const unlocked = (it) => state.showAll || it.unlock.type !== 'badge' && it.unlock.type !== 'phase' ? true : (['Question Fixer', 'Brave Guesser', 'Data Collector', 'Graph Explorer', 'Ask', 'Plan', 'Collect', 'Explore'].includes(it.unlock.ref)) || state.showAll;
const isUnlocked = (it) => state.showAll || it.unlock.type === 'starter' || ['Question Fixer', 'Brave Guesser', 'Data Collector', 'Graph Explorer', 'Ask', 'Plan', 'Collect', 'Explore'].includes(it.unlock.ref);

function pipSVG(talking) {
  const A = (slot, part) => { const id = state.worn[slot]; if (!id) return ''; const it = byId(id); return (it.art[part || slot]) || ''; };
  const cape = state.worn.back ? byId(state.worn.back).art : {};
  const held = A('held');
  return `<svg viewBox="0 0 120 132" role="img" aria-label="Pip the owl${Object.values(state.worn).length ? ', wearing ' + Object.values(state.worn).map(i => byId(i).name.toLowerCase()).join(', ') : ''}" class="${talking ? 'talk' : ''}"><g class="pbob">
${A('back')}
<ellipse cx="20" cy="84" rx="10" ry="22" fill="#9A6A3A" ${S}/>
<path d="M24 40 L22 14 L42 30 Z" fill="#9A6A3A" ${S}/><path d="M96 40 L98 14 L78 30 Z" fill="#9A6A3A" ${S}/>
<ellipse cx="60" cy="78" rx="42" ry="46" fill="#9A6A3A" stroke="#17324D" stroke-width="4"/>
<ellipse cx="60" cy="94" rx="27" ry="26" fill="#F7E1B5"/>
<path d="M47 88 q6.5 7 13 0 q6.5 7 13 0" stroke="#C99443" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M47 100 q6.5 7 13 0 q6.5 7 13 0" stroke="#C99443" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<circle cx="43" cy="58" r="15" fill="#fff" ${S}/><circle cx="77" cy="58" r="15" fill="#fff" ${S}/>
<g class="eyes"><circle cx="43" cy="59" r="7" fill="#17324D"/><circle cx="77" cy="59" r="7" fill="#17324D"/><circle cx="46" cy="56" r="2.5" fill="#fff"/><circle cx="80" cy="56" r="2.5" fill="#fff"/></g>
<circle cx="28" cy="74" r="5" fill="#FF9A8B" opacity=".7"/><circle cx="92" cy="74" r="5" fill="#FF9A8B" opacity=".7"/>
<g class="beak"><path d="M53 70 L67 70 L60 82 Z" fill="#FF9F1C" stroke="#17324D" stroke-width="2" stroke-linejoin="round"/></g>
<path d="M44 122 l-6 7 h14 Z M76 122 l-6 7 h14 Z" fill="#FF9F1C"/>
${state.worn.back && cape.neck ? cape.neck : ''}${A('neck')}
${A('face')}${A('head')}
<g class="wingR"><ellipse cx="100" cy="84" rx="10" ry="22" fill="#9A6A3A" ${S}/>${held}</g>
</g></svg>`;
}

function render() {
  document.getElementById('pip').innerHTML = pipSVG(state.talking);
  document.getElementById('bub').textContent = state.line;
  const total = ITEMS.length, got = ITEMS.filter(isUnlocked).length;
  document.getElementById('count').innerHTML = '<svg width="20" height="20" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5 L39.5 22 L58 23.8 L44 36 L48.2 54 L32 44.6 L15.8 54 L20 36 L6 23.8 L24.5 22Z" fill="#FFC531" stroke="#17324D" stroke-width="5" stroke-linejoin="round"/></svg>You found ' + got + ' of ' + total + ' things';
  document.getElementById('tabs').innerHTML = SLOTS.map(([s, n]) => {
    const fresh = ITEMS.filter(i => i.slot === s && i.isNew && !state.seen[i.id] && isUnlocked(i)).length;
    return `<button type="button" class="tab" role="tab" aria-selected="${state.tab === s}" data-tab="${s}">${n}${fresh ? `<span class="dot" aria-label="${fresh} new">${fresh}</span>` : ''}</button>`;
  }).join('');
  const list = ITEMS.filter(i => i.slot === state.tab);
  document.getElementById('grid').innerHTML = list.map(it => {
    const open = isUnlocked(it), on = state.worn[it.slot] === it.id;
    const art = Object.values(it.art).join('');
    const fresh = it.isNew && !state.seen[it.id] && open;
    return `<button type="button" role="listitem" class="card${open ? '' : ' locked'}" data-id="${it.id}" aria-pressed="${on}" ${open ? '' : 'aria-label="' + it.name + ', locked. ' + it.hint + '"'}>
      ${on ? `<span class="tick">${TICKSVG}</span>` : ''}${fresh ? '<span class="new">New!</span>' : ''}
      <span class="pv"><svg viewBox="${it.vb}" aria-hidden="true">${art}</svg></span>
      ${open ? '' : `<span class="lock">${LOCKSVG}</span>`}
      <span class="nm">${it.name}</span></button>`;
  }).join('');
}

let talkT = null, sparkN = 0;
function say(text, talk) {
  state.line = text; state.talking = true; render();
  clearTimeout(talkT); talkT = setTimeout(() => { state.talking = false; document.querySelector('#pip svg') && document.querySelector('#pip svg').classList.remove('talk'); }, Math.min(2600, 600 + text.length * 55));
  const b = document.getElementById('bub'); b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
}
function celebrate() {
  const w = document.getElementById('pip'); w.classList.remove('hop'); void w.offsetWidth; w.classList.add('hop');
  const stage = document.querySelector('.stage');
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2 + Math.random() * .5, d = 90 + Math.random() * 60;
    const el = document.createElement('div'); el.className = 'spk';
    el.style.left = (232 + Math.cos(a) * 20) + 'px'; el.style.top = (350 + Math.sin(a) * 20) + 'px';
    el.style.setProperty('--x', Math.cos(a) * d + 'px'); el.style.setProperty('--y', Math.sin(a) * d - 30 + 'px');
    el.innerHTML = '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 1 Q13.6 10.4 23 12 Q13.6 13.6 12 23 Q10.4 13.6 1 12 Q10.4 10.4 12 1Z" fill="#FFC531" stroke="#17324D" stroke-width="1.6" stroke-linejoin="round"/></svg>';
    stage.appendChild(el); setTimeout(() => el.remove(), 900);
  }
}
document.getElementById('tabs').addEventListener('click', (e) => { const t = e.target.closest('[data-tab]'); if (!t) return; state.tab = t.dataset.tab; render(); });
document.getElementById('grid').addEventListener('click', (e) => {
  const c = e.target.closest('[data-id]'); if (!c) return;
  const it = byId(c.dataset.id);
  if (!isUnlocked(it)) {
    c.classList.add('shake'); setTimeout(() => c.classList.remove('shake'), 500);
    say(it.hint, true); return;
  }
  state.seen[it.id] = true;
  if (state.worn[it.slot] === it.id) { delete state.worn[it.slot]; say('Okay, that is off. What next?', true); }
  else { state.worn[it.slot] = it.id; say(it.say, true); celebrate(); }
  render();
});
document.getElementById('bare').onclick = () => { state.worn = {}; say('Brrr, I feel bare! Dress me again?', true); celebrate(); render(); };
document.getElementById('surprise').onclick = () => {
  const w = {};
  SLOTS.forEach(([s]) => { const opts = ITEMS.filter(i => i.slot === s && isUnlocked(i)); if (opts.length && (s === 'head' || Math.random() < .6)) w[s] = opts[Math.floor(Math.random() * opts.length)].id; });
  state.worn = w; say('Ta-da! Do you like my new look?', true); celebrate(); render();
};
document.getElementById('demo').onclick = function () { state.showAll = !state.showAll; if (!state.showAll) Object.keys(state.worn).forEach(s => { if (!isUnlocked(byId(state.worn[s]))) delete state.worn[s]; }); this.textContent = state.showAll ? 'Demo only: back to the pretend child progress' : 'Demo only: show every item unlocked'; render(); };

function fit() { const k = Math.min(innerWidth / 960, innerHeight / 600); document.getElementById('fit').style.transform = 'translate(-50%,-50%) scale(' + k + ')'; }
addEventListener('resize', fit); fit(); say(state.line, false); state.talking = false; render();
</script>
