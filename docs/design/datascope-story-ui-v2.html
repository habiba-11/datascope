<title>DataScope: opening story, version 2 (richer and more realistic)</title>
<!--
  DataScope opening story, VERSION 2: a richer, more realistic look. One file, no build step.
  Open in a browser and press "Start the story". Same 7 scenes, same words, same sound and voice as version 1
  (docs/datascope-story-ui.html), but a new picture.

  What is new in this version:
   - Real places: a sunny school yard (sky, sun with rays, layered clouds, hills, tree line, school building with a flag,
     fence, bench, big swaying tree, grass, flowers, birds, a butterfly) and a bright classroom (window with a sun beam
     and floating dust, wood floor, whiteboard, wall clock, desks, plant, bookshelf).
   - A slow "camera": every scene pushes in gently and changes focus point. Soft light, vignette and a little grain.
   - Characters with shading and more detail: Sara (full body, hair puffs, eyes with iris and highlights, sneakers),
     four different classmates (including one in a hijab and one with glasses), and Pip with feathers, glossy eyes
     and a shaded explorer hat. Mouths move only when someone speaks. Everyone breathes, blinks and moves.
   - The story props are bigger and clearer: a pinned guess note, answer bubbles, a growing bar chart, number cards with the
     centre number, a 3D die that really rolls, the Evidence Card with a stamp, falling confetti, and the pretend class of 25.
  Sound: effects, composed music loop (C - Am - F - G, ~104 bpm, ducks while someone speaks) and read-aloud voice, each with
  its own switch in the top bar. prefers-reduced-motion turns every movement off.
  Where the words live: the SCENES array in the script. In the real app these lines go in data/content.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@700;800&display=swap">
<style>
html,body{margin:0;height:100%;background:#0E2236;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:#17324D}

.sc .grow{transform-origin:50% 100%;transform-box:fill-box}
.sc.on .grow{animation:growbar 1.1s cubic-bezier(.3,1.4,.5,1) both}
#light{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 30% 10%,rgba(255,244,200,.35),transparent 55%),radial-gradient(ellipse at 50% 55%,transparent 50%,rgba(14,34,54,.38) 100%);mix-blend-mode:soft-light}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(8,24,40,.28) 100%)}

.hdr{position:absolute;left:0;top:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-sizing:border-box;z-index:20}

.bt{min-height:46px;padding:0 20px;border-radius:17px;border:3px solid #17324D;background:#fff;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:18px;box-shadow:0 4px 0 #17324D}
.bt.go{background:#217A3B;color:#fff}
.bt.go.end{min-height:54px;font-size:22px;animation:nudge 1.2s ease-in-out infinite}
.rep{width:40px;height:40px;border-radius:14px;border:3px solid #17324D;background:#E6F4FF;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:11px;height:11px;border-radius:50%;background:#C9D6E2;display:block}
.dots i.d{background:#4CC26B}.dots i.c{background:#17324D}
.skip{background:none;border:none;font-weight:800;font-size:13px;color:#4A6580;text-decoration:underline;padding:0}
#cover,#done{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;background:rgba(14,34,54,.42);backdrop-filter:blur(5px);color:#fff}

#done h1{text-shadow:none}
#cover p,#done p{margin:0;font-weight:800;font-size:19px;max-width:560px}
#cover small{font-weight:700;font-size:14px;opacity:.9}
#cover .bt,#done .bt{font-size:24px;min-height:58px;padding:0 34px}
.card3{filter:drop-shadow(0 8px 10px rgba(8,24,40,.28))}
@keyframes popin{0%{opacity:0;transform:scale(.6) translateY(16px)}100%{opacity:1;transform:none}}
@keyframes growbar{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.018)}}
@keyframes headtilt{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes jaw{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.15)}}
@keyframes beak{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
@keyframes wingwave{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}
@keyframes wingidle{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
@keyframes wingflap{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
@keyframes hopj{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px)}}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes grass{0%,100%{transform:skewX(-4deg)}50%{transform:skewX(4deg)}}
@keyframes cloud{from{transform:translateX(-260px)}to{transform:translateX(1240px)}}
@keyframes fly{from{transform:translateX(-120px)}to{transform:translateX(1100px)}}
@keyframes wavy{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.25)}}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.1)}}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes flagw{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(5deg) scaleX(.93)}}
@keyframes zz{0%{opacity:0;transform:translate(0,8px) scale(.7)}40%{opacity:1}100%{opacity:0;transform:translate(14px,-26px) scale(1.15)}}
@keyframes confetti{0%{transform:translateY(-40px) rotate(0)}100%{transform:translateY(520px) rotate(720deg)}}
@keyframes sec{to{transform:rotate(360deg)}}
@keyframes rollin{0%{transform:translate(-210px,-70px) rotate(-420deg);opacity:0}35%{opacity:1}60%{transform:translate(16px,10px) rotate(40deg)}78%{transform:translate(-10px,-34px) rotate(-18deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes stampin{0%{opacity:0;transform:scale(2.6) rotate(-18deg)}60%{opacity:1;transform:scale(.92) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-9deg)}}
@keyframes bubblepop{0%{opacity:0;transform:scale(.4)}60%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes dlga{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes dlgb{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.headtilt{transform-box:fill-box;transform-origin:50% 100%;animation:headtilt 4.4s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.4s infinite}
.mouth-open{display:none;transform-box:fill-box;transform-origin:50% 0%}
.talk .mouth-open{display:inline;animation:jaw .26s ease-in-out infinite}
.talk .mouth-closed{display:none}
.beak-top{transform-box:fill-box;transform-origin:50% 100%}
.talk .beak-low{animation:beak .26s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0%}
.bob{animation:float 2.8s ease-in-out infinite}
.hop{animation:hopj .62s ease-in-out infinite}
.cloud{animation:cloud linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}.g1,.g2,.g3{animation:none !important}}
</style>

<div id="cover"><svg width="120" height="120" viewBox="0 0 140 150" id="coverPip" aria-hidden="true"></svg><h1>Meet Sara, a young investigator!</h1><p>Watch her solve a mystery with data. Then it is YOUR turn!</p><button class="bt go" id="start" type="button">Start the story</button><small>Sound is on. Use the buttons at the top right to change it.</small></div>

<script>
const SCENES = [
{ chip: 'Step 1: Ask', chipBg: '#FF7A6B', lines: [
{ who: 'pip', text: 'Hi! I am Pip the owl. Watch Sara solve a mystery, then it will be YOUR turn!' },
{ who: 'sara', text: 'Hmm... do my classmates sleep enough?' },
{ who: 'pip', text: 'Every investigation starts with a QUESTION. That is the Ask step!' } ] },
{ chip: 'Step 2: Plan', chipBg: '#FFC531', lines: [
{ who: 'sara', text: 'I think they sleep about 8 hours.' },
{ who: 'pip', text: 'Good plan! Scientists GUESS first, then check with data.' } ] },
{ chip: 'Step 3: Collect', chipBg: '#38B6FF', lines: [
{ who: 'sara', text: 'Hi! How many hours did you sleep last night?' },
{ who: 'kids', text: 'Nine! ... Eight!' },
{ who: 'kids', text: 'Ten! ... Only three... yawn!' },
{ who: 'pip', text: 'Every answer is a piece of DATA. Now Sara can look for a pattern.' } ] },
{ chip: 'Step 4: Explore, graph', chipBg: '#4CC26B', lines: [
{ who: 'sara', text: 'I will draw a graph, so I can SEE the answers.' },
{ who: 'sara', text: 'Most kids sleep 8 or 9 hours. But one kid sleeps only 3!' },
{ who: 'pip', text: 'Graphs help us see the answer. The tallest bar is what most kids said.' } ] },
{ chip: 'Step 4: Explore, numbers and chance', chipBg: '#4CC26B', lines: [
{ who: 'sara', text: 'Now numbers! The centre number is 9 and the mean is 7.8.' },
{ who: 'pip', text: 'Sara guessed 8 hours. That was very close!' },
{ who: 'pip', text: 'Chance tells us how SURE we can be. Watch the die roll!' } ] },
{ chip: 'Step 5: Conclude', chipBg: '#A596FF', lines: [
{ who: 'sara', text: 'I think most kids sleep 8 to 9 hours. My proof: the centre number is 9.' },
{ who: 'sara', text: 'I am quite sure. I say: LIKELY!' },
{ who: 'kids', text: 'Hooray! Great thinking, Sara!' } ] },
{ chip: 'Your mission', chipBg: '#217A3B', lines: [

function pip(mood) {

    this.el.ibtns.innerHTML = [['sfx', 'Sound effects'], ['music', 'Music'], ['voice', 'Read aloud']].map(a => `<button class="ib" type="button" data-k="${a[0]}" aria-label="${a[1]}" aria-pressed="true">${ICON[a[0]]}</button>`).join('');
    this.el.ibtns.querySelectorAll('button').forEach(b => b.onclick = () => ({ sfx: this.toggleSfx, music: this.toggleMusic, voice: this.toggleVoice })[b.dataset.k]());
    this.el.start.onclick = () => { this.el.cover.style.display = 'none'; this.start(); };
    this.el.nx.onclick = this.next; this.el.bk.onclick = this.back; this.el.sk.onclick = this.skip;
    this.el.again.onclick = () => { this.restart(); };
    this.el.rep.onclick = () => { const l = SCENES[this.state.scene].lines[this.state.line]; this.speak(l.who, l.text, true); };
    this.el.trail.innerHTML = STEPS.map((s, i) => `<div class="st" data-i="${i}">${i ? '<span class="conn"></span>' : ''}<span class="dot" style="background:${s[1]}">${i + 1}</span><span class="lbl"></span></div>`).join('');
    document.addEventListener('keydown', e => { if (!this.state.started) return; if (e.key === 'ArrowRight') this.next(); if (e.key === 'ArrowLeft') this.back(); });
  }
  update() {
    const s = this.state, el = this.el, sc = SCENES[s.scene], ln = sc.lines[s.line];
    el.cover.style.display = s.started ? 'none' : 'flex';
    el.done.style.display = s.launched ? 'flex' : 'none';
    el.ibtns.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(!!s[b.dataset.k])));
    if (this.lastScene !== s.scene) {
      const w = el.world, cam = CAM[s.scene];
      w.classList.remove('drift'); w.style.setProperty('--z', 1); w.style.setProperty('--ox', cam[0] + '%'); w.style.setProperty('--oy', cam[1] + '%');
      w.classList.toggle('indoor', SC[s.scene].indoor);
      document.querySelectorAll('.sc').forEach((n, i) => n.classList.toggle('on', i === s.scene));
      void w.offsetWidth;
      clearTimeout(this.camT);
      this.camT = setTimeout(() => { w.classList.add('drift'); w.style.setProperty('--z', cam[2]); }, 80);
      this.lastScene = s.scene;
    }
    const sec = document.getElementById('s' + s.scene); sec.setAttribute('data-line', s.line);
    // characters
    SC[s.scene].chars.forEach(c => {
      const host = sec.querySelector(`.char[data-id="${c.id}"]`), gw = host.firstChild, mood = c.mood(s.line), key = c.type + mood;
      if (gw.dataset.key !== key) { gw.dataset.key = key; gw.innerHTML = c.type === 'pip' ? pip(mood) : c.type === 'sara' ? sara(mood) : kid(KIDS[c.k], mood); }
      const sp = s.talk && s.started && ((ln.who === 'pip' && c.id === 'pip') || (ln.who === 'sara' && c.id === 'sara') || (ln.who === 'kids' && c.type === 'kid'));
      host.classList.toggle('talk', !!sp);
    });
    // dialog
    el.av.style.background = { pip: '#FFE9B0', sara: '#FFD3CC', kids: '#CFEAFF' }[ln.who];
    if (el.av.dataset.who !== ln.who) { el.av.dataset.who = ln.who; el.av.firstChild && el.av.querySelector('svg') && el.av.querySelector('svg').remove(); el.av.insertAdjacentHTML('afterbegin', avatar(ln.who)); }
    el.who.textContent = { pip: 'Pip', sara: 'Sara', kids: 'Class' }[ln.who];
    el.chip.textContent = sc.chip; el.chip.style.background = sc.chipBg; el.chip.style.color = sc.chipBg === '#217A3B' ? '#fff' : NV;
    el.sn.textContent = (s.line + 1) + ' of ' + sc.lines.length;
    const key = s.scene + ':' + s.line;
    if (this.txtKey !== key) { this.txtKey = key; el.txt.textContent = ln.text; el.txt.classList.toggle('sm', ln.text.length > 70); el.txt.style.animation = 'none'; void el.txt.offsetWidth; el.txt.style.animation = 'dlga .35s ease both'; }
    el.dots.innerHTML = sc.lines.map((_, i) => `<i class="${i < s.line ? 'd' : i === s.line ? 'c' : ''}"></i>`).join('');
    const last = s.scene === SCENES.length - 1 && s.line === sc.lines.length - 1;
    el.nx.textContent = last ? 'Start mission' : 'Next'; el.nx.classList.toggle('end', last);
    el.bk.disabled = s.scene === 0 && s.line === 0; el.bk.style.opacity = el.bk.disabled ? .45 : 1;
    el.sk.style.visibility = s.scene === SCENES.length - 1 ? 'hidden' : 'visible';
    const cur = STEP_OF_SCENE[s.scene];
    el.trail.querySelectorAll('.st').forEach((n, i) => { n.className = 'st' + (i < cur ? ' done' : i === cur ? ' cur' : ''); n.querySelector('.dot').textContent = i < cur ? '✓' : i + 1; n.querySelector('.lbl').textContent = i === cur ? STEPS[i][0] : ''; });
  }
}
function fit() { const f = document.getElementById('fit'); const k = Math.min(innerWidth / 960, innerHeight / 600); f.style.transform = `translate(-50%,-50%) scale(${k})`; }
addEventListener('resize', fit); fit();
window.story = new Story();

</script>
