<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataScope – Explore: Number Lab</title>
<!-- VISUAL + MOTION REFERENCE ONLY (DataScope round-2 UI frames, Explorer's Toolkit).
     Inline styles keep it readable. In the real app: values go to css/theme.css variables,
     the m-* motion classes go to css/motion.css, and texts come from the content files. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#166FAD}a:hover{color:#0F5383}
.m-rise{animation:m-rise .5s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0) * 90ms + var(--d,0ms))}
.m-ring{position:relative}
.m-ring::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:3px solid currentColor;animation:m-ring 1.8s ease-out infinite}
.m-sort{animation:m-sort 7s cubic-bezier(.45,0,.35,1) 1s infinite}
.m-mid{animation:m-sort 7s cubic-bezier(.45,0,.35,1) 1s infinite, m-mid 7s linear 1s infinite}
.m-arrow{animation:m-arrow 7s linear 1s infinite}
.m-pulse{animation:m-pulse 1.8s ease-in-out 2s infinite}
@keyframes m-rise{from{opacity:0;transform:translateY(18px)}}
@keyframes m-ring{0%{opacity:.9;transform:scale(.85)}100%{opacity:0;transform:scale(1.35)}}
@keyframes m-sort{0%,14%{transform:none}26%{transform:translateX(calc(var(--x) * .5)) translateY(-34px) rotate(-6deg)}38%,86%{transform:translateX(var(--x))}96%,100%{transform:none}}
@keyframes m-mid{0%,42%{background:#FFFFFF}48%,84%{background:#4CC26B}90%,100%{background:#FFFFFF}}
@keyframes m-arrow{0%,44%{opacity:0;transform:translateY(-10px)}50%,84%{opacity:1;transform:none}90%,100%{opacity:0}}
@keyframes m-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}.m-ring::after{display:none}}
</style>
</head>
<body>
<div style="position: relative; overflow: hidden; width: 100%; min-height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #E6F4FF; font-family: 'Nunito', sans-serif; color: #17324D">

  <!-- ZONE 1: top bar -->
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 28px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4l18 10v20L24 44 6 34V14z" fill="#4CC26B"></path><circle cx="22" cy="22" r="9" fill="#FFFFFF" stroke="#17324D" stroke-width="4"></circle><line x1="29" y1="29" x2="36" y2="36" stroke="#17324D" stroke-width="5" stroke-linecap="round"></line></svg>
      <span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 28px; line-height: 1">Data<span style="color: #2E9A4F">Scope</span></span>
    </div>
    <nav aria-label="Your investigation trail" style="flex: 1 1 300px; display: flex; justify-content: center; align-items: flex-end; gap: 6px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px"><span style="width: 38px; height: 38px; border-radius: 50%; background: #2E9A4F; border: 3px solid #17324D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg></span>Ask</div>
      <span aria-hidden="true" style="width: 28px; height: 4px; border-radius: 2px; background: #2E9A4F; margin-bottom: 26px"></span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px"><span style="width: 38px; height: 38px; border-radius: 50%; background: #2E9A4F; border: 3px solid #17324D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg></span>Plan</div>
      <span aria-hidden="true" style="width: 28px; height: 4px; border-radius: 2px; background: #2E9A4F; margin-bottom: 26px"></span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px"><span style="width: 38px; height: 38px; border-radius: 50%; background: #2E9A4F; border: 3px solid #17324D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg></span>Collect</div>
      <span aria-hidden="true" style="width: 28px; height: 4px; border-radius: 2px; background: #2E9A4F; margin-bottom: 26px"></span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px"><span class="m-ring" style="color: #4CC26B; width: 46px; height: 46px; border-radius: 50%; background: #4CC26B; border: 3px solid #17324D; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"></path></svg></span>Explore</div>
      <span aria-hidden="true" style="width: 28px; border-top: 4px dotted #9CC6E6; margin-bottom: 26px"></span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px; color: #4A6580"><span style="width: 38px; height: 38px; border-radius: 50%; background: #FFFFFF; border: 3px dashed #9CC6E6; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A6580" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><rect x="6" y="11" width="12" height="9" rx="2"></rect><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg></span>More soon</div>
    </nav>
    <div style="display: flex; gap: 10px">
      <button type="button" aria-label="What is this step?" style="width: 52px; height: 52px; border: 3px solid #17324D; border-radius: 16px; background: #FFFFFF; box-shadow: 0 4px 0 #17324D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg></button>
      <button type="button" aria-label="Recap: mean, median, mode" style="width: 52px; height: 52px; border: 3px solid #17324D; border-radius: 16px; background: #FFC531; box-shadow: 0 4px 0 #17324D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3zM21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"></path></svg></button>
      <button type="button" aria-label="My backpack: 3 badges" style="height: 52px; padding: 0 14px 0 8px; border: 3px solid #17324D; border-radius: 16px; background: #FFFFFF; box-shadow: 0 4px 0 #17324D; display: flex; align-items: center; gap: 8px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 17px; color: #17324D; cursor: pointer"><svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true"><path d="M17 12a7 7 0 0 1 14 0" fill="none" stroke="#17324D" stroke-width="4"></path><rect x="8" y="12" width="32" height="32" rx="10" fill="#FF7A6B" stroke="#17324D" stroke-width="3.5"></rect><rect x="15" y="27" width="18" height="12" rx="4" fill="#FFD9D4" stroke="#17324D" stroke-width="3"></rect></svg>3</button>
    </div>
  </header>

  <!-- ZONE 2: one task card -->
  <main style="flex-grow: 1; width: 100%; max-width: 1000px; margin: 0 auto; padding: 8px 24px 0; box-sizing: border-box">
    <section class="m-rise" style="background: #FFFFFF; border: 3px solid #17324D; border-radius: 28px; box-shadow: 0 7px 0 #17324D; overflow: hidden">
      <!-- Explore sub-rooms as tabs -->
      <div role="tablist" aria-label="Explore rooms" style="display: flex; flex-wrap: wrap; gap: 0; background: #4CC26B; border-bottom: 3px solid #17324D">
        <button type="button" role="tab" aria-selected="false" style="flex: 1; min-height: 52px; border: 0; border-right: 3px solid #17324D; background: transparent; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 19px; color: #17324D; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg>Graph Lab</button>
        <button type="button" role="tab" aria-selected="true" style="flex: 1; min-height: 52px; border: 0; border-right: 3px solid #17324D; background: #FFFFFF; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 19px; color: #17324D; cursor: pointer">Number Lab</button>
        <button type="button" role="tab" aria-selected="false" aria-disabled="true" style="flex: 1; min-height: 52px; border: 0; background: transparent; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 19px; color: #17324D; display: flex; align-items: center; justify-content: center; gap: 8px; opacity: 0.75"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><rect x="6" y="11" width="12" height="9" rx="2"></rect><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg>Chance Lab</button>
      </div>

      <div style="padding: 20px 28px 26px; display: flex; flex-direction: column; gap: 18px">
        <!-- Mini stepper inside the task -->
        <ol aria-label="Steps in this task" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; font-weight: 800; font-size: 15px">
          <li style="display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: #D5F2DC"><span style="width: 26px; height: 26px; border-radius: 50%; background: #2E9A4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center">✓</span>Guess</li>
          <li style="display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: #17324D; color: #FFFFFF"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; color: #17324D; display: flex; align-items: center; justify-content: center">2</span>Sort</li>
          <li style="display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: #EEF3F7; color: #4A6580"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center">3</span>Find the middle</li>
        </ol>

        <div style="display: flex; align-items: center; gap: 14px">
          <svg width="52" height="49" viewBox="0 0 200 190" aria-hidden="true" style="flex: 0 0 auto"><path d="M40 150c0-56 26-84 60-84s60 28 60 84c0 30-24 40-60 40s-60-10-60-40z" fill="#C98A4B" stroke="#17324D" stroke-width="6"></path><path d="M62 78l-6-18 18 10M138 78l6-18-18 10" fill="#C98A4B" stroke="#17324D" stroke-width="5" stroke-linejoin="round"></path><circle cx="78" cy="112" r="22" fill="#FFFFFF" stroke="#17324D" stroke-width="5"></circle><circle cx="122" cy="112" r="22" fill="#FFFFFF" stroke="#17324D" stroke-width="5"></circle><circle cx="82" cy="114" r="9" fill="#17324D"></circle><circle cx="126" cy="114" r="9" fill="#17324D"></circle><path d="M92 134l8 11 8-11z" fill="#FFC531" stroke="#17324D" stroke-width="3" stroke-linejoin="round"></path></svg>
          <div>
            <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1">Put the cards in order</h1>
            <p style="margin: 2px 0 0; font-weight: 700; font-size: 18px">Smallest to biggest. Then find the middle card!</p>
          </div>
        </div>

        <!-- Sorting stage -->
        <div style="padding: 24px 12px 18px; background: #F4FAFF; border: 3px dashed #9CC6E6; border-radius: 22px; overflow-x: auto">
          <div style="position: relative; width: 564px; height: 190px; margin: 0 auto">
            <div class="m-arrow" aria-hidden="true" style="position: absolute; left: 232px; top: 0; width: 100px; display: flex; flex-direction: column; align-items: center; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px; color: #2E9A4F">Middle!<svg width="22" height="16" viewBox="0 0 22 16"><path d="M2 2l9 11 9-11z" fill="#2E9A4F"></path></svg></div>
            <div class="m-mid" style="--x: 232px; position: absolute; left: 0; top: 44px; width: 100px; height: 130px; box-sizing: border-box; background: #FFFFFF; border: 3px solid #17324D; border-radius: 18px; box-shadow: 0 5px 0 #17324D; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 48px; line-height: 1">9</span><span style="font-weight: 800; font-size: 14px">hours</span></div>
            <div class="m-sort" style="--x: -116px; position: absolute; left: 116px; top: 44px; width: 100px; height: 130px; box-sizing: border-box; background: #FFFFFF; border: 3px solid #17324D; border-radius: 18px; box-shadow: 0 5px 0 #17324D; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 48px; line-height: 1">3</span><span style="font-weight: 800; font-size: 14px">hours</span></div>
            <div class="m-sort" style="--x: 232px; position: absolute; left: 232px; top: 44px; width: 100px; height: 130px; box-sizing: border-box; background: #FFFFFF; border: 3px solid #17324D; border-radius: 18px; box-shadow: 0 5px 0 #17324D; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 48px; line-height: 1">10</span><span style="font-weight: 800; font-size: 14px">hours</span></div>
            <div class="m-sort" style="--x: -232px; position: absolute; left: 348px; top: 44px; width: 100px; height: 130px; box-sizing: border-box; background: #FFFFFF; border: 3px solid #17324D; border-radius: 18px; box-shadow: 0 5px 0 #17324D; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 48px; line-height: 1">8</span><span style="font-weight: 800; font-size: 14px">hours</span></div>
            <div class="m-sort" style="--x: -116px; position: absolute; left: 464px; top: 44px; width: 100px; height: 130px; box-sizing: border-box; background: #FFFFFF; border: 3px solid #17324D; border-radius: 18px; box-shadow: 0 5px 0 #17324D; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 48px; line-height: 1">9</span><span style="font-weight: 800; font-size: 14px">hours</span></div>
          </div>
          <p style="margin: 6px 0 0; text-align: center; font-weight: 700; font-size: 15px; color: #4A6580">Drag a card. Or tap a card, then tap where it goes.</p>
        </div>
      </div>
    </section>
  </main>

  <!-- ZONE 3: action bar -->
  <footer style="width: 100%; max-width: 1000px; margin: 0 auto; padding: 22px 24px 26px; box-sizing: border-box; display: flex; align-items: center; gap: 14px">
    <button type="button" style="min-height: 56px; padding: 0 20px; border: 3px solid #9CC6E6; border-radius: 16px; background: transparent; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 20px; color: #17324D; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Back</button>
    <span style="flex-grow: 1"></span>
    <button type="button" style="min-height: 56px; padding: 0 22px; border: 3px solid #17324D; border-radius: 16px; background: #FFFFFF; box-shadow: 0 5px 0 #17324D; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 20px; color: #17324D; cursor: pointer">Hint</button>
    <button type="button" class="m-pulse" style="min-height: 58px; padding: 0 30px; border: 3px solid #17324D; border-radius: 18px; background: #2E9A4F; color: #FFFFFF; box-shadow: 0 5px 0 #17324D; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; cursor: pointer">Check my order</button>
  </footer>
</div>
</body>
</html>
