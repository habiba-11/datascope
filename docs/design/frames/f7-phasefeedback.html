<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataScope – Phase feedback and unlock</title>
<!-- VISUAL + MOTION REFERENCE ONLY (DataScope round-2 UI frames, Explorer's Toolkit).
     Inline styles keep it readable. In the real app: values go to css/theme.css variables,
     the m-* motion classes go to css/motion.css, and texts come from the content files. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#166FAD}a:hover{color:#0F5383}
.m-fade{animation:m-fade .25s ease-out both}
.m-modal{animation:m-modal .6s cubic-bezier(.34,1.56,.64,1) .1s both}
.m-star{animation:m-star .6s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i) * 300ms + 600ms)}
.m-rise{animation:m-rise .45s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0) * 140ms + var(--d,0ms))}
.m-shake{animation:m-shake .4s ease-in-out 2.6s 2}
.m-shackle{animation:m-shackle .4s cubic-bezier(.34,1.56,.64,1) 3.4s both}
.m-lockout{animation:m-lockout .4s ease-in 3.9s both}
.m-open{animation:m-open .6s cubic-bezier(.34,1.56,.64,1) 4.1s both}
.m-pulse{animation:m-pulse 1.8s ease-in-out 4.5s infinite}
@keyframes m-fade{from{opacity:0}}
@keyframes m-modal{0%{opacity:0;transform:translateY(40px) scale(.7)}100%{opacity:1;transform:none}}
@keyframes m-star{0%{opacity:0;transform:scale(0) rotate(-180deg)}70%{transform:scale(1.3) rotate(10deg)}100%{opacity:1;transform:none}}
@keyframes m-rise{from{opacity:0;transform:translateY(16px)}}
@keyframes m-shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes m-shackle{to{transform:translateY(-6px) rotate(-25deg)}}
@keyframes m-lockout{to{opacity:0;transform:scale(1.6)}}
@keyframes m-open{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:none}}
@keyframes m-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}.m-lockout{display:none}}
</style>
</head>
<body>
<div style="position: relative; overflow: hidden; width: 100%; min-height: 800px; box-sizing: border-box; background: #E6F4FF; font-family: 'Nunito', sans-serif; color: #17324D">
  <div aria-hidden="true" style="padding: 16px 28px; display: flex; align-items: center; gap: 10px">
    <svg width="40" height="40" viewBox="0 0 48 48"><path d="M24 4l18 10v20L24 44 6 34V14z" fill="#4CC26B"></path><circle cx="22" cy="22" r="9" fill="#FFFFFF" stroke="#17324D" stroke-width="4"></circle><line x1="29" y1="29" x2="36" y2="36" stroke="#17324D" stroke-width="5" stroke-linecap="round"></line></svg>
    <span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 28px">Data<span style="color: #2E9A4F">Scope</span></span>
  </div>
  <div aria-hidden="true" style="max-width: 952px; height: 560px; margin: 8px auto 0; background: #FFFFFF; border: 3px solid #17324D; border-radius: 28px; box-shadow: 0 7px 0 #17324D"></div>

  <div class="m-fade" style="position: absolute; inset: 0; background: rgba(23, 50, 77, 0.55); display: flex; align-items: center; justify-content: center; padding: 24px">
    <div class="m-modal" role="dialog" aria-modal="true" aria-labelledby="fb-title" style="width: 100%; max-width: 520px; background: #FFFFFF; border: 3px solid #17324D; border-radius: 30px; box-shadow: 0 8px 0 #17324D; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 22px; background: #38B6FF; border-bottom: 3px solid #17324D">
        <svg width="54" height="51" viewBox="0 0 200 190" aria-hidden="true"><path d="M40 150c0-56 26-84 60-84s60 28 60 84c0 30-24 40-60 40s-60-10-60-40z" fill="#C98A4B" stroke="#17324D" stroke-width="6"></path><path d="M62 78l-6-18 18 10M138 78l6-18-18 10" fill="#C98A4B" stroke="#17324D" stroke-width="5" stroke-linejoin="round"></path><circle cx="78" cy="112" r="22" fill="#FFFFFF" stroke="#17324D" stroke-width="5"></circle><circle cx="122" cy="112" r="22" fill="#FFFFFF" stroke="#17324D" stroke-width="5"></circle><path d="M68 114q10-12 20 0M112 114q10-12 20 0" fill="none" stroke="#17324D" stroke-width="6" stroke-linecap="round"></path><path d="M92 134l8 11 8-11z" fill="#FFC531" stroke="#17324D" stroke-width="3" stroke-linejoin="round"></path></svg>
        <h2 id="fb-title" style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 28px">Collect: done!</h2>
      </div>

      <div style="padding: 18px 26px 24px; display: flex; flex-direction: column; gap: 14px">
        <div role="img" aria-label="3 out of 3 thinking stars" style="display: flex; justify-content: center; gap: 12px">
          <svg class="m-star" style="--i: 0" width="70" height="70" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l5 10.2 11.2 1.6-8.1 7.9 1.9 11.2L20 28.6l-10 5.3 1.9-11.2-8.1-7.9L15 13.2z" fill="#FFC531" stroke="#17324D" stroke-width="2.5" stroke-linejoin="round"></path></svg>
          <svg class="m-star" style="--i: 1; margin-top: -12px" width="84" height="84" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l5 10.2 11.2 1.6-8.1 7.9 1.9 11.2L20 28.6l-10 5.3 1.9-11.2-8.1-7.9L15 13.2z" fill="#FFC531" stroke="#17324D" stroke-width="2.5" stroke-linejoin="round"></path></svg>
          <svg class="m-star" style="--i: 2" width="70" height="70" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l5 10.2 11.2 1.6-8.1 7.9 1.9 11.2L20 28.6l-10 5.3 1.9-11.2-8.1-7.9L15 13.2z" fill="#FFC531" stroke="#17324D" stroke-width="2.5" stroke-linejoin="round"></path></svg>
        </div>
        <p class="m-rise" style="--d: 1500ms; margin: 0; text-align: center; font-weight: 800; font-size: 16px; color: #4A6580">Stars are for great thinking, not speed.</p>

        <div class="m-rise" style="--d: 1650ms; background: #EAF8EE; border-radius: 18px; padding: 12px 16px">
          <h3 style="margin: 0 0 6px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 19px">You did great</h3>
          <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 17px">
            <li style="display: flex; gap: 8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E9A4F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M5 12l5 5L19 7"></path></svg>You asked all 20 classmates.</li>
            <li style="display: flex; gap: 8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E9A4F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M5 12l5 5L19 7"></path></svg>You spotted the 3-hour answer.</li>
          </ul>
        </div>
        <div class="m-rise" style="--d: 1850ms; display: flex; gap: 10px; align-items: flex-start; background: #FFF4CF; border-radius: 18px; padding: 12px 16px; font-weight: 700; font-size: 17px">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"></path></svg>
          <span><b>Next time:</b> say what surprised you.</span>
        </div>

        <!-- Next stop: unlock -->
        <div class="m-rise" style="--d: 2100ms; display: flex; align-items: center; justify-content: center; gap: 14px; padding-top: 4px">
          <span style="font-weight: 800; font-size: 17px">Next stop:</span>
          <span style="position: relative; width: 56px; height: 56px">
            <span class="m-open" style="position: absolute; inset: 0; border-radius: 50%; background: #4CC26B; border: 3px solid #17324D; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"></path></svg></span>
            <span class="m-lockout" style="position: absolute; inset: 0; border-radius: 50%; background: #FFFFFF; border: 3px dashed #9CC6E6; display: flex; align-items: center; justify-content: center">
              <svg class="m-shake" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4A6580" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><rect x="6" y="11" width="12" height="9" rx="2"></rect><path class="m-shackle" style="transform-origin: 15.5px 11px" d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg>
            </span>
          </span>
          <span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px">Explore</span>
        </div>

        <button type="button" class="m-rise" style="--d: 2300ms; align-self: center; min-height: 60px; padding: 0 30px; border: 3px solid #17324D; border-radius: 18px; background: #2E9A4F; color: #FFFFFF; box-shadow: 0 5px 0 #17324D; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 23px; cursor: pointer"><span class="m-pulse" style="display: inline-flex; align-items: center; gap: 10px">Go to Explore<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
