<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataScope – Explore: Chance Lab</title>
<!-- VISUAL + MOTION REFERENCE ONLY (DataScope round-2 UI frames, Explorer's Toolkit).
     Inline styles keep it readable. In the real app: values go to css/theme.css variables,
     the m-* motion classes go to css/motion.css, and texts come from the content files. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#166FAD}a:hover{color:#0F5383}
.m-rise{animation:m-rise .5s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0) * 90ms + var(--d,0ms))}
.m-ring{position:relative}
.m-ring::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:3px solid currentColor;animation:m-ring 1.8s ease-out infinite}
.m-spin{transform-origin:110px 110px;animation:m-spin 5s cubic-bezier(.15,.6,.2,1) .8s infinite}
.m-grow{transform-origin:bottom;animation:m-grow 5s cubic-bezier(.34,1.56,.64,1) .8s infinite;animation-delay:calc(var(--i,0) * 120ms + 3.4s)}
.m-tick{animation:m-tick 5s ease-out .8s infinite}
.m-pulse{animation:m-pulse 1.8s ease-in-out 2s infinite}
@keyframes m-rise{from{opacity:0;transform:translateY(18px)}}
@keyframes m-ring{0%{opacity:.9;transform:scale(.85)}100%{opacity:0;transform:scale(1.35)}}
@keyframes m-spin{0%{transform:rotate(0)}55%,100%{transform:rotate(1800deg)}}
@keyframes m-grow{0%{transform:scaleY(0)}16%,100%{transform:scaleY(1)}}
@keyframes m-tick{0%,50%{transform:rotate(0)}53%{transform:rotate(-14deg)}58%,100%{transform:rotate(0)}}
@keyframes m-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}.m-ring::after{display:none}}
</style>
</head>
<body>
<div style="position: relative; overflow: hidden; width: 100%; min-height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #E6F4FF; font-family: 'Nunito', sans-serif; color: #17324D">

  <!-- ZONE 1: top bar -->
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 28px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4l18 10v20L24 44 6 34V14z" fill="#4CC26B"></path><circle cx="22" cy="22" r="9" fill="#FFFFFF" stroke="#17324D" stroke-width="4"></circle><line x1="29" y1="29" x2="36" y2="36" stroke="#17324D" stroke-width="5" stroke-linecap="round"></line></svg>
      <span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 28px; line-height: 1">Data<span style="color: #2E9A4F">Scope</span></span>
    </div>
    <nav aria-label="Your investigation trail" style="flex: 1 1 300px; display: flex; justify-content: center; align-items: flex-end; gap: 6px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px"><span style="width: 38px; height: 38px; border-radius: 50%; background: #2E9A4F; border: 3px solid #17324D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg></span>Ask</div>
      <span aria-hidden="true" style="width: 28px; height: 4px; border-radius: 2px; background: #2E9A4F; margin-bottom: 26px"></span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px"><span style="width: 38px; height: 38px; border-radius: 50%; background: #2E9A4F; border: 3px solid #17324D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg></span>Plan</div>
      <span aria-hidden="true" style="width: 28px; height: 4px; border-radius: 2px; background: #2E9A4F; margin-bottom: 26px"></span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px"><span style="width: 38px; height: 38px; border-radius: 50%; background: #2E9A4F; border: 3px solid #17324D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg></span>Collect</div>
      <span aria-hidden="true" style="width: 28px; height: 4px; border-radius: 2px; background: #2E9A4F; margin-bottom: 26px"></span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px"><span class="m-ring" style="color: #4CC26B; width: 46px; height: 46px; border-radius: 50%; background: #4CC26B; border: 3px solid #17324D; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"></path></svg></span>Explore</div>
      <span aria-hidden="true" style="width: 28px; border-top: 4px dotted #9CC6E6; margin-bottom: 26px"></span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px; color: #4A6580"><span style="width: 38px; height: 38px; border-radius: 50%; background: #FFFFFF; border: 3px dashed #9CC6E6; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A6580" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><rect x="6" y="11" width="12" height="9" rx="2"></rect><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg></span>More soon</div>
    </nav>
    <div style="display: flex; gap: 10px">
      <button type="button" aria-label="What is this step?" style="width: 52px; height: 52px; border: 3px solid #17324D; border-radius: 16px; background: #FFFFFF; box-shadow: 0 4px 0 #17324D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg></button>
      <button type="button" aria-label="My backpack: 4 badges" style="height: 52px; padding: 0 14px 0 8px; border: 3px solid #17324D; border-radius: 16px; background: #FFFFFF; box-shadow: 0 4px 0 #17324D; display: flex; align-items: center; gap: 8px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 17px; color: #17324D; cursor: pointer"><svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true"><path d="M17 12a7 7 0 0 1 14 0" fill="none" stroke="#17324D" stroke-width="4"></path><rect x="8" y="12" width="32" height="32" rx="10" fill="#FF7A6B" stroke="#17324D" stroke-width="3.5"></rect><rect x="15" y="27" width="18" height="12" rx="4" fill="#FFD9D4" stroke="#17324D" stroke-width="3"></rect></svg>4</button>
    </div>
  </header>

  <!-- ZONE 2: one task card -->
  <main style="flex-grow: 1; width: 100%; max-width: 1000px; margin: 0 auto; padding: 8px 24px 0; box-sizing: border-box">
    <section class="m-rise" style="background: #FFFFFF; border: 3px solid #17324D; border-radius: 28px; box-shadow: 0 7px 0 #17324D; overflow: hidden">
      <div role="tablist" aria-label="Explore rooms" style="display: flex; flex-wrap: wrap; background: #4CC26B; border-bottom: 3px solid #17324D">
        <button type="button" role="tab" aria-selected="false" style="flex: 1; min-height: 52px; border: 0; border-right: 3px solid #17324D; background: transparent; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 19px; color: #17324D; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg>Graph Lab</button>
        <button type="button" role="tab" aria-selected="false" style="flex: 1; min-height: 52px; border: 0; border-right: 3px solid #17324D; background: transparent; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 19px; color: #17324D; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg>Number Lab</button>
        <button type="button" role="tab" aria-selected="true" style="flex: 1; min-height: 52px; border: 0; background: #FFFFFF; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 19px; color: #17324D; cursor: pointer">Chance Lab</button>
      </div>

      <div style="padding: 20px 28px 26px; display: flex; flex-direction: column; gap: 16px">
        <ol aria-label="Steps in this task" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; font-weight: 800; font-size: 15px">
          <li style="display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: #D5F2DC"><span style="width: 26px; height: 26px; border-radius: 50%; background: #2E9A4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center">✓</span>List what can happen</li>
          <li style="display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: #D5F2DC"><span style="width: 26px; height: 26px; border-radius: 50%; background: #2E9A4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center">✓</span>Guess</li>
          <li style="display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: #17324D; color: #FFFFFF"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; color: #17324D; display: flex; align-items: center; justify-content: center">3</span>Test</li>
          <li style="display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: #EEF3F7; color: #4A6580"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center">4</span>Compare</li>
        </ol>

        <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1">Spin Pip's recess spinner!</h1>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; align-items: center">
          <!-- Spinner + tries -->
          <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
            <div style="position: relative; width: 220px; height: 236px">
              <svg class="m-tick" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true" style="position: absolute; left: 93px; top: 0; z-index: 2; transform-origin: 17px 6px"><path d="M17 32L4 8a13 13 0 0 1 26 0z" fill="#17324D"></path><circle cx="17" cy="10" r="5" fill="#FFFFFF"></circle></svg>
              <svg width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="Spinner: half is coral, a quarter is gold, a quarter is sky blue" style="position: absolute; left: 0; top: 16px">
                <g class="m-spin">
                  <path d="M110 110L110 10A100 100 0 0 1 110 210Z" fill="#FF7A6B" stroke="#17324D" stroke-width="4"></path>
                  <path d="M110 110L110 210A100 100 0 0 1 10 110Z" fill="#FFC531" stroke="#17324D" stroke-width="4"></path>
                  <path d="M110 110L10 110A100 100 0 0 1 110 10Z" fill="#38B6FF" stroke="#17324D" stroke-width="4"></path>
                  <text x="160" y="118" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="24" fill="#17324D">1/2</text>
                  <text x="68" y="166" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="22" fill="#17324D">1/4</text>
                  <text x="68" y="76" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="22" fill="#17324D">1/4</text>
                </g>
                <circle cx="110" cy="110" r="14" fill="#FFFFFF" stroke="#17324D" stroke-width="4"></circle>
              </svg>
            </div>
            <div role="radiogroup" aria-label="How many spins?" style="display: flex; border: 3px solid #17324D; border-radius: 16px; overflow: hidden; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 19px">
              <button type="button" role="radio" aria-checked="false" style="min-width: 76px; min-height: 50px; border: 0; border-right: 3px solid #17324D; background: #FFFFFF; font: inherit; color: #17324D; cursor: pointer">10</button>
              <button type="button" role="radio" aria-checked="false" style="min-width: 76px; min-height: 50px; border: 0; border-right: 3px solid #17324D; background: #FFFFFF; font: inherit; color: #17324D; cursor: pointer">50</button>
              <button type="button" role="radio" aria-checked="true" style="min-width: 76px; min-height: 50px; border: 0; background: #17324D; font: inherit; color: #FFFFFF; cursor: pointer">500</button>
            </div>
          </div>

          <!-- Should vs did -->
          <div style="display: flex; flex-direction: column; gap: 10px">
            <h2 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 20px">Should happen vs. did happen</h2>
            <div style="display: flex; gap: 16px; font-weight: 800; font-size: 15px">
              <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 18px; border: 3px dashed #17324D; border-radius: 4px; background: #FFFFFF"></span>Should</span>
              <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 18px; border: 3px solid #17324D; border-radius: 4px; background: #17324D"></span>Did (500 spins)</span>
            </div>
            <div style="height: 200px; display: flex; align-items: flex-end; gap: 22px; padding: 0 8px; border-bottom: 4px solid #17324D">
              <div style="flex: 1; display: flex; align-items: flex-end; gap: 6px">
                <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px">50%<div style="width: 100%; height: 160px; border: 3px dashed #17324D; border-bottom: 0; border-radius: 8px 8px 0 0; background: #FFFFFF"></div></div>
                <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px">47%<div class="m-grow" style="--i: 0; width: 100%; height: 150px; border: 3px solid #17324D; border-bottom: 0; border-radius: 8px 8px 0 0; background: #FF7A6B"></div></div>
              </div>
              <div style="flex: 1; display: flex; align-items: flex-end; gap: 6px">
                <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px">25%<div style="width: 100%; height: 80px; border: 3px dashed #17324D; border-bottom: 0; border-radius: 8px 8px 0 0; background: #FFFFFF"></div></div>
                <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px">27%<div class="m-grow" style="--i: 1; width: 100%; height: 86px; border: 3px solid #17324D; border-bottom: 0; border-radius: 8px 8px 0 0; background: #FFC531"></div></div>
              </div>
              <div style="flex: 1; display: flex; align-items: flex-end; gap: 6px">
                <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px">25%<div style="width: 100%; height: 80px; border: 3px dashed #17324D; border-bottom: 0; border-radius: 8px 8px 0 0; background: #FFFFFF"></div></div>
                <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 15px">26%<div class="m-grow" style="--i: 2; width: 100%; height: 83px; border: 3px solid #17324D; border-bottom: 0; border-radius: 8px 8px 0 0; background: #38B6FF"></div></div>
              </div>
            </div>
            <div style="display: flex; gap: 22px; padding: 0 8px; font-weight: 800; font-size: 15px; text-align: center"><span style="flex: 1">Coral</span><span style="flex: 1">Gold</span><span style="flex: 1">Sky</span></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ZONE 3: action bar -->
  <footer style="width: 100%; max-width: 1000px; margin: 0 auto; padding: 22px 24px 26px; box-sizing: border-box; display: flex; align-items: center; gap: 14px">
    <button type="button" style="min-height: 56px; padding: 0 20px; border: 3px solid #9CC6E6; border-radius: 16px; background: transparent; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 20px; color: #17324D; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Back</button>
    <span style="flex-grow: 1"></span>
    <button type="button" style="min-height: 56px; padding: 0 22px; border: 3px solid #17324D; border-radius: 16px; background: #FFFFFF; box-shadow: 0 5px 0 #17324D; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 20px; color: #17324D; cursor: pointer">Hint</button>
    <button type="button" class="m-pulse" style="min-height: 58px; padding: 0 30px; border: 3px solid #17324D; border-radius: 18px; background: #2E9A4F; color: #FFFFFF; box-shadow: 0 5px 0 #17324D; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; cursor: pointer">Spin 500 times</button>
  </footer>
</div>
</body>
</html>
