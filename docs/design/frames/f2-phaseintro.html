<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataScope – Phase intro pop-up</title>
<!-- VISUAL + MOTION REFERENCE ONLY (DataScope round-2 UI frames, Explorer's Toolkit).
     Inline styles keep it readable. In the real app: values go to css/theme.css variables,
     the m-* motion classes go to css/motion.css, and texts come from the content files. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#166FAD}a:hover{color:#0F5383}
.m-fade{animation:m-fade .25s ease-out both}
.m-modal{animation:m-modal .6s cubic-bezier(.34,1.56,.64,1) .1s both}
.m-pip{animation:m-pip .6s cubic-bezier(.34,1.56,.64,1) .55s both}
.m-rise{animation:m-rise .45s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0) * 140ms + var(--d,0ms))}
.m-spin{animation:m-spin .6s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i,0) * 140ms + var(--d,0ms))}
.m-pulse{animation:m-pulse 1.8s ease-in-out 1.8s infinite}
@keyframes m-fade{from{opacity:0}}
@keyframes m-modal{0%{opacity:0;transform:translateY(40px) scale(.7)}100%{opacity:1;transform:none}}
@keyframes m-pip{0%{transform:translateY(60px)}100%{transform:none}}
@keyframes m-rise{from{opacity:0;transform:translateY(16px)}}
@keyframes m-spin{0%{opacity:0;transform:scale(.3) rotate(-120deg)}100%{opacity:1;transform:none}}
@keyframes m-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div style="position: relative; overflow: hidden; width: 100%; min-height: 800px; box-sizing: border-box; background: #E6F4FF; font-family: 'Nunito', sans-serif; color: #17324D">

  <!-- The room behind, kept simple -->
  <div aria-hidden="true" style="padding: 16px 28px; display: flex; align-items: center; gap: 10px">
    <svg width="40" height="40" viewBox="0 0 48 48"><path d="M24 4l18 10v20L24 44 6 34V14z" fill="#4CC26B"></path><circle cx="22" cy="22" r="9" fill="#FFFFFF" stroke="#17324D" stroke-width="4"></circle><line x1="29" y1="29" x2="36" y2="36" stroke="#17324D" stroke-width="5" stroke-linecap="round"></line></svg>
    <span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 28px">Data<span style="color: #2E9A4F">Scope</span></span>
  </div>
  <div aria-hidden="true" style="max-width: 952px; height: 560px; margin: 8px auto 0; background: #FFFFFF; border: 3px solid #17324D; border-radius: 28px; box-shadow: 0 7px 0 #17324D"></div>

  <!-- Backdrop + pop-up -->
  <div class="m-fade" style="position: absolute; inset: 0; background: rgba(23, 50, 77, 0.55); display: flex; align-items: center; justify-content: center; padding: 24px">
    <div style="position: relative; width: 100%; max-width: 500px; padding-top: 104px">
      <svg class="m-pip" width="130" height="124" viewBox="0 0 200 190" aria-hidden="true" style="position: absolute; top: 0; left: 50%; margin-left: -65px">
        <path d="M40 150c0-56 26-84 60-84s60 28 60 84c0 30-24 40-60 40s-60-10-60-40z" fill="#C98A4B" stroke="#17324D" stroke-width="5"></path>
        <path d="M62 78l-6-18 18 10M138 78l6-18-18 10" fill="#C98A4B" stroke="#17324D" stroke-width="4" stroke-linejoin="round"></path>
        <circle cx="78" cy="112" r="22" fill="#FFFFFF" stroke="#17324D" stroke-width="4"></circle><circle cx="122" cy="112" r="22" fill="#FFFFFF" stroke="#17324D" stroke-width="4"></circle>
        <circle cx="82" cy="114" r="9" fill="#17324D"></circle><circle cx="126" cy="114" r="9" fill="#17324D"></circle>
        <path d="M92 134l8 11 8-11z" fill="#FFC531" stroke="#17324D" stroke-width="3" stroke-linejoin="round"></path>
      </svg>
      <div class="m-modal" role="dialog" aria-modal="true" aria-labelledby="intro-title" style="position: relative; background: #FFFFFF; border: 3px solid #17324D; border-radius: 30px; box-shadow: 0 8px 0 #17324D; overflow: hidden">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: #FF7A6B; border-bottom: 3px solid #17324D; font-weight: 800; font-size: 16px">
          <span>Step 1 of 5</span>
          <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: 3px solid #17324D; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
        <div style="padding: 20px 28px 26px; display: flex; flex-direction: column; gap: 16px">
          <h2 id="intro-title" class="m-rise" style="--d: 450ms; margin: 0; text-align: center; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.1">Ask a question</h2>
          <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
            <li class="m-rise" style="--i: 0; --d: 700ms; display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: #FFF1EF; border-radius: 18px; font-weight: 800; font-size: 19px"><span class="m-spin" style="--i: 0; --d: 750ms; flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; background: #FF7A6B; border: 3px solid #17324D; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 9a3 3 0 1 1 4 2.8c-.8.4-1 1-1 2.2"></path><circle cx="12" cy="18" r=".6"></circle></svg></span>Pick a question to explore.</li>
            <li class="m-rise" style="--i: 1; --d: 700ms; display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: #FFF1EF; border-radius: 18px; font-weight: 800; font-size: 19px"><span class="m-spin" style="--i: 1; --d: 750ms; flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; background: #FFC531; border: 3px solid #17324D; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg></span>Check that it is a good question.</li>
            <li class="m-rise" style="--i: 2; --d: 700ms; display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: #FFF1EF; border-radius: 18px; font-weight: 800; font-size: 19px"><span class="m-spin" style="--i: 2; --d: 750ms; flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; background: #38B6FF; border: 3px solid #17324D; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19l4-1L19 8l-3-3L6 15z"></path></svg></span>Fix questions that are not clear.</li>
          </ul>
          <button type="button" class="m-rise" style="--d: 1250ms; align-self: center; min-height: 60px; padding: 0 40px; border: 3px solid #17324D; border-radius: 18px; background: #2E9A4F; color: #FFFFFF; box-shadow: 0 5px 0 #17324D; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px; cursor: pointer"><span class="m-pulse" style="display: inline-block">Let's go!</span></button>
          <p class="m-rise" style="--d: 1400ms; margin: 0; text-align: center; font-weight: 700; font-size: 15px; color: #4A6580">Tap the (i) button any time to see this again.</p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
